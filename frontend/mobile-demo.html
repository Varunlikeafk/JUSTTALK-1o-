x;letter-spacing:.04em;color:var(--text-dim);border:1px solid var(--line);padding:3px 9px;border-radius:20px;margin-bottom:16px;}\n  .model-card h3{font-size:19px;margin-bottom:8px;}\n  .model-card p{font-size:13px;color:var(--text-dim);line-height:1.5;flex:1;}\n  .model-cta{margin-top:16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:gap .2s ease;}\n  .model-card:not(.disabled):hover .model-cta{gap:10px;}\n  .model-cta.launch{color:#fff;}\n  .model-cta.soon{color:var(--text-dim);}\n\n  /* ---------- WARP TRANSITION ---------- */\n  #view-warp{background:var(--void);}\n  #warp-canvas{position:absolute;inset:0;}\n  .warp-flash{position:absolute;inset:0;background:#d1fae5;opacity:0;pointer-events:none;animation:warpFlash 2.6s ease-in forwards;}\n  @keyframes warpFlash{0%,86%{opacity:0;}97%{opacity:.95;}100%{opacity:0;}}\n  .warp-caption{\n    position:absolute;bottom:14%;left:0;right:0;text-align:center;color:var(--text-dim);\n    font-size:13px;letter-spacing:.08em;animation:captionFade 2.6s ease both;\n  }\n  @keyframes captionFade{0%{opacity:0;letter-spacing:.3em;}20%{opacity:1;letter-spacing:.08em;}82%{opacity:1;}100%{opacity:0;}}\n\n  /* ---------- CHAT VIEW ---------- */\n  #view-chat{align-items:stretch;justify-content:stretch;}\n  #app-shell{display:flex;height:100%;width:100%;background:var(--void);}\n\n  #sidebar{\n    width:264px;background:#071a14;border-right:1px solid var(--line);\n    display:flex;flex-direction:column;padding:14px;flex-shrink:0;\n    transition:transform .25s ease;\n  }\n  .side-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin:14px 4px 8px;}\n  .new-chat-btn{border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:#fff;font-size:13.5px;background:transparent;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;transition:.15s;}\n  .new-chat-btn:hover{background:var(--panel-2);}\n  .side-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--text-dim);font-size:13.5px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;position:relative;transition:color .15s ease, padding-left .18s ease;}\n  .side-link::before{content:\"\";position:absolute;left:0;top:0;bottom:0;width:2px;border-radius:2px;background:var(--grad);transform:scaleY(0);transition:transform .18s ease;}\n  .side-link:hover{background:var(--panel-2);color:var(--text);padding-left:14px;}\n  .side-link:hover::before{transform:scaleY(1);}\n  .side-link .ico{width:16px;text-align:center;}\n\n  .profile-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);margin-bottom:6px;}\n  .avatar-sm{width:30px;height:30px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0a0a0d;flex-shrink:0;}\n  .profile-meta{overflow:hidden;}\n  .profile-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n  .profile-plan{font-size:11px;color:var(--text-dim);}\n\n  .side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;}\n  .toggle-card{background:var(--panel);border-radius:10px;padding:11px 12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}\n  .toggle-card .label{font-size:12.5px;color:var(--text-dim);}\n  .toggle-switch{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0;}\n  .toggle-switch input{opacity:0;width:0;height:0;}\n  .toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--line);transition:.2s;border-radius:22px;}\n  .toggle-slider:before{position:absolute;content:\"\";height:15px;width:15px;left:3px;bottom:3px;background:#fff;transition:.2s;border-radius:50%;}\n  .toggle-switch input:checked + .toggle-slider{background:var(--violet);}\n  .toggle-switch input:checked + .toggle-slider:before{transform:translateX(17px);}\n  .credit-card{background:var(--panel);border-radius:10px;padding:11px 12px;border:1px solid var(--line);}\n  .credit-card-title{font-size:10.5px;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:3px;letter-spacing:.03em;}\n  .credit-value{font-size:17px;font-weight:700;color:var(--green);font-family:'Space Grotesk';}\n\n  #main-container{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--void);}\n  #header{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:600;font-size:14.5px;color:var(--text-dim);flex-shrink:0;}\n  #header .h-left{display:flex;align-items:center;gap:12px;}\n  #menuToggle{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;line-height:1;}\n  .h-status{font-size:11.5px;color:var(--green);display:flex;align-items:center;gap:5px;}\n\n  #chat-flow{flex:1;overflow-y:auto;padding:22px 0;display:flex;flex-direction:column;gap:26px;}\n  .chat-row{width:100%;max-width:760px;margin:0 auto;padding:0 20px;display:flex;gap:14px;}\n  .chat-row.msg-enter{animation:rowEnter .45s cubic-bezier(.22,1,.36,1) both;}\n  @keyframes rowEnter{from{opacity:0;transform:translateY(10px);filter:blur(4px);}to{opacity:1;transform:translateY(0);filter:blur(0);}}\n  .user-row{justify-content:flex-end;}\n\n  .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}\n  .bot-avatar{background:var(--grad);color:#0a0a0d;}\n  .user-avatar{background:#1c3a2f;color:#fff;border:1px solid var(--line);}\n\n  .bubble-container{flex:1;max-width:85%;min-width:0;}\n  .user-bubble{background:var(--panel-2);padding:10px 15px;border-radius:16px;color:var(--text);display:inline-block;float:right;font-size:14.5px;line-height:1.5;}\n  .bot-bubble{color:var(--text);font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}\n\n  .think-bar{background:#071a14;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;font-size:12px;}\n  .think-header{padding:8px 12px;background:var(--panel-2);color:#b4d4c5;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;}\n  .think-content{padding:10px 12px;color:#7fa595;font-style:italic;white-space:pre-wrap;word-break:break-word;max-height:280px;overflow-y:auto;}\n\n  .meta-row{display:flex;align-items:center;gap:12px;margin-top:8px;}\n  .meta-tag{font-size:11px;color:#6f9585;}\n  .copy-msg-btn{font-size:11px;color:var(--text-dim);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;transition:.15s;}\n  .copy-msg-btn:hover{color:#fff;border-color:#2a4a3d;}\n\n  .code-box{background:#071a14;border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden;}\n  .code-box-header{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:var(--panel-2);font-size:11.5px;color:var(--text-dim);}\n  .code-box-header button{font-size:11px;color:var(--text-dim);background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;}\n  .code-box-header button:hover{color:#fff;border-color:#2a4a3d;}\n  .code-box pre{margin:0;padding:12px 14px;overflow-x:auto;font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;color:#d6efe4;white-space:pre;}\n\n  #input-container{width:100%;max-width:760px;margin:0 auto 22px auto;padding:0 20px;flex-shrink:0;}\n  .input-box{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;}\n  .input-box input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14.5px;}\n  .input-box button{background:#2a4a3d;color:#0a0a0d;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;transition:.2s;flex-shrink:0;}\n  .input-box button.active{background:var(--grad);color:#0a0a0d;animation:sendPulse 1.6s ease-in-out infinite;}\n  .input-box button:active{transform:scale(.9);}\n  @keyframes sendPulse{0%,100%{box-shadow:0 0 0 0 rgba(25,195,125,.45);}50%{box-shadow:0 0 0 6px rgba(25,195,125,0);}}\n  .input-box{transition:border-color .2s ease;}\n  .input-box:focus-within{border-color:var(--violet);}\n\n  #sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5;}\n\n  /* ---------- RESPONSIVE ---------- */\n  @media (max-width:900px){\n    #menuToggle{display:block;}\n    #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:10;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.5);}\n    #sidebar.open{transform:translateX(0);}\n    #sidebar-overlay.show{display:block;}\n    .bubble-container{max-width:100%;}\n    .model-grid{gap:16px;}\n    .model-card{width:100%;max-width:340px;}\n  }\n  @media (max-width:520px){\n    .auth-card{padding:28px 20px 24px;border-radius:16px;}\n    .auth-title{font-size:22px;}\n    .chat-row{padding:0 12px;gap:10px;}\n    #input-container{padding:0 12px;}\n    .hub-head h2{font-size:23px;}\n  }\n\n  /* ---------- MOTION SAFETY ---------- */\n  @media (prefers-reduced-motion: reduce){\n    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}\n  }\n\n\n/* =========================================================================\n   LANDING-SYNC LAYER (same motion language as landing.html)\n   ========================================================================= */\n@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}\n\n/* live status dot, like the landing terminal */\n.h-status::before{content:\"\";width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.6s ease-in-out infinite;}\n\n/* card hover lift, same as landing .feat-card */\n.profile-card,.toggle-card,.credit-card{transition:transform .2s ease, border-color .2s ease;}\n.profile-card:hover,.toggle-card:hover,.credit-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18);}\n\n/* credit number pulses when it changes */\n.credit-value{display:inline-block;transition:color .3s ease;}\n.credit-value.bump{animation:creditBump .5s cubic-bezier(.22,1,.36,1);}\n@keyframes creditBump{0%{transform:scale(1);}40%{transform:scale(1.25);}100%{transform:scale(1);}}\n\n/* \"routing...\" loader line, same as landing terminal */\n.think-content.routing{animation:blink 1.2s ease-in-out infinite;}\n.think-bar{position:relative;}\n.think-bar.live::after{\n  content:\"\";position:absolute;left:0;bottom:0;height:2px;width:40%;\n  background:var(--grad);animation:thinkSweep 1.3s ease-in-out infinite;\n}\n@keyframes thinkSweep{0%{transform:translateX(-100%);}100%{transform:translateX(260%);}}\n\n/* gradient marquee strip (same as landing) on the splash screen */\n.splash-marquee{position:absolute;left:-2%;right:-2%;bottom:22%;overflow:hidden;transform:rotate(-1deg);pointer-events:none;}\n.splash-marquee .marquee{display:flex;white-space:nowrap;background:var(--grad);padding:10px 0;}\n.splash-marquee .mq-track{display:flex;gap:24px;animation:mq 20s linear infinite;padding-right:24px;}\n.splash-marquee .mq-track span{font-family:'Space Grotesk';font-weight:700;font-size:12.5px;letter-spacing:.06em;color:#0a0a0d;text-transform:uppercase;display:flex;gap:24px;align-items:center;}\n@keyframes mq{from{transform:translateX(0);}to{transform:translateX(-50%);}}\n\n/* back-to-website link */\n.site-link{color:var(--text-dim);font-size:13px;text-decoration:none;transition:color .15s;}\n.site-link:hover{color:var(--text);}\n.brand-row .site-link{margin-left:14px;}\n\n\n/* =========================================================================\n   LANDING UX PORT: nav header, hero empty-state, router chips, glass input\n   ========================================================================= */\n#main-container{position:relative;}\n#header{background:rgba(4,18,14,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07);}\n.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#0a0a0d;font-weight:800;font-size:13px;font-family:'Space Grotesk';}\n.hdr-title{color:var(--text);font-family:'Space Grotesk';font-weight:700;}\n\n/* glass terminal-style input */\n.input-box{background:rgba(7,26,20,.75);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px);box-shadow:0 30px 70px rgba(0,0,0,.35);}\n.input-box button{border-radius:10px;width:36px;height:36px;background:rgba(255,255,255,.08);color:#fff;}\n.input-box button.active{color:#0a0a0d;}\n\n/* hero empty state (landing hero) */\n#empty-state{position:absolute;top:52px;bottom:96px;left:0;right:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow-y:auto;transition:opacity .4s ease, transform .4s ease;}\n#empty-state.hide{opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-10px);}\n#empty-state>*{animation:cardRise .7s cubic-bezier(.22,1,.36,1) both;}\n#empty-state>*:nth-child(2){animation-delay:.08s;} #empty-state>*:nth-child(3){animation-delay:.16s;} #empty-state>*:nth-child(4){animation-delay:.24s;}\n.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:6px 14px;border-radius:30px;font-size:12.5px;color:var(--text-dim);margin-bottom:22px;}\n.eyebrow b{color:#fff;}\n#empty-state h1{font-size:clamp(28px,5vw,46px);line-height:1.1;font-weight:700;margin-bottom:16px;}\n#empty-state .hl{background-image:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbowRun 6s linear infinite;}\n#empty-state .lead{color:var(--text-dim);font-size:15px;line-height:1.6;max-width:46ch;margin-bottom:26px;}\n.chip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:620px;width:100%;}\n@media (max-width:600px){.chip-grid{grid-template-columns:1fr;}}\n.chip{text-align:left;color:var(--text);cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;font-family:inherit;transition:transform .2s ease, border-color .2s ease, background .2s ease;}\n.chip:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.07);}\n.chip b{font-size:13.5px;font-weight:600;line-height:1.4;}\n.feat-icon{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:14px;color:#0a0a0d;}\n.pill{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:3px 9px;font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;color:#a7f3d0;}\n\n/* router chips (landing \"Five routers. One flow.\") */\n.router-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line);}\n.router-step{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:5px 10px;font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;color:var(--text-dim);display:flex;gap:6px;align-items:center;opacity:0;animation:chipIn .35s ease forwards;animation-delay:calc(var(--i) * 110ms);}\n.router-step b{color:#fff;}\n.router-arrow{color:var(--pink);font-weight:700;font-size:12px;}\n.router-step.passed{opacity:.45;animation-name:chipInDim;}\n.router-step.idle{animation-name:chipInDim;}\n.router-step.active{border-color:transparent;color:#0a0a0d;background:var(--grad);box-shadow:0 0 18px rgba(25,195,125,.35);animation-name:chipIn;}\n.router-step.active b{color:#0a0a0d;}\n.router-flow.scanning .router-step{opacity:1;animation:scanChip 2.5s ease-in-out infinite;animation-delay:calc(var(--i) * 350ms);}\n@keyframes chipIn{from{opacity:0;transform:translateY(6px) scale(.94);}to{opacity:1;transform:none;}}\n@keyframes chipInDim{from{opacity:0;transform:translateY(6px) scale(.94);}to{opacity:.4;transform:none;}}\n@keyframes scanChip{0%,60%,100%{border-color:rgba(255,255,255,.1);color:var(--text-dim);}25%{border-color:var(--orange);color:#fff;box-shadow:0 0 14px rgba(110,231,183,.35);}}\n\n/* smooth think accordion (landing FAQ) */\n.think-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}\n.think-bar.open .think-body{max-height:340px;}\n.think-header .arrow{transition:transform .2s ease;font-size:10px;}\n.think-bar.open .think-header .arrow{transform:rotate(180deg);}\n\n/* meta pills + credit delta (landing net-pill / credit cards) */\n.meta-pill{background:rgba(7,26,20,.75);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:3px 9px;font-size:11px;color:var(--text-dim);}\n.delta{font-family:'Space Grotesk';font-weight:700;font-size:12px;padding:3px 9px;border-radius:8px;animation:creditBump .5s cubic-bezier(.22,1,.36,1);}\n.delta.pos{color:var(--green);background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);}\n.delta.neg{color:#ff4d6d;background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.3);}\n\n/* sidebar credit bar (landing bar-track / bar-fill) */\n.bar-track{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px;}\n.bar-fill{height:100%;border-radius:6px;background:var(--grad);transition:width .8s cubic-bezier(.22,1,.36,1);}\n.bar-fill.neg{background:linear-gradient(90deg,#ff4d4d,#ff2f6e);}\n\n\n/* ---- fixes from browser test ---- */\n.bot-bubble .code-box{white-space:normal;}                 /* template whitespace was rendering as blank lines */\n#empty-state{justify-content:flex-start;}                  /* center + overflow clipped the top on short screens */\n#empty-state>.eyebrow{margin-top:auto;}\n#empty-state>.chip-grid{margin-bottom:auto;}\n@media (max-width:600px){\n  #empty-state{padding:14px;}\n  #empty-state .lead{margin-bottom:16px;font-size:14px;}\n  .chip{padding:12px 14px;gap:6px;}\n  .chip .pill{display:none;}\n  .chip-grid{gap:10px;}\n}\n\n\n/* ===== streaming text animation ===== */\n.sw{display:inline-block;white-space:pre-wrap;animation:sw-in .32s ease-out both;}\n@keyframes sw-in{0%{opacity:0;filter:blur(6px);transform:translateY(2px)}100%{opacity:1;filter:blur(0);transform:none}}\n.sw-block{animation:fade-up .4s cubic-bezier(.23,1,.32,1) both;}\n.stream-caret{display:inline-block;width:2px;height:14px;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--text);animation:caret-blink .9s steps(2,start) infinite;}\n@keyframes caret-blink{to{visibility:hidden}}\n@keyframes fade-up{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}\n@keyframes pop-in{0%{opacity:0;transform:scale(.95)}100%{opacity:1;transform:none}}\n\n.stream-extras{opacity:0;pointer-events:none;transition:opacity .4s ease;margin-top:6px;}\n.stream-extras.show{opacity:1;pointer-events:auto;}\n.stream-actions{display:flex;align-items:center;gap:2px;flex-wrap:wrap;}\n.act-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--text-dim);border-radius:6px;cursor:pointer;transition:background .12s,color .12s;}\n.act-btn:hover{background:var(--panel-2);color:var(--text);}\n.act-btn.on{color:var(--orange);}\n.src-chip{margin-left:8px;display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 6px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);font:11px 'Space Grotesk',monospace;text-decoration:none;transition:color .15s,border-color .15s;}\n.src-chip:hover{color:var(--text);border-color:#2a4a3d;}\n.src-dot{width:8px;height:8px;border-radius:50%;background:var(--grad);}\n.stream-extras.show .src-chip{animation:pop-in .25s cubic-bezier(.23,1,.32,1) both;}\n.stream-followups{margin-top:10px;}\n.fu-title{font-size:12px;font-weight:500;color:var(--text-dim);margin-bottom:2px;}\n.fu-btn{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font-size:13px;padding:7px 4px;cursor:pointer;transition:background .12s;opacity:0;}\n.stream-extras.show .fu-btn{animation:fade-up .35s cubic-bezier(.23,1,.32,1) calc(var(--i)*90ms) both;}\n.fu-btn:hover{background:var(--panel-2);}\n@media (prefers-reduced-motion:reduce){.sw,.sw-block{animation:none}}\n\n\n/* =========================================================================\n   THEMING: dark (default) + light, with circular-reveal transition\n   ========================================================================= */\n:root{color-scheme:dark;}\n:root[data-theme=\"light\"]{\n  color-scheme:light;\n  --void:#f3faf6;\n  --panel:#ffffff;\n  --panel-2:#e7f3ed;\n  --line:#cde3d8;\n  --text:#0b2a1f;\n  --text-dim:#4a695b;\n  --violet:#0d8f6c;\n  --pink:#12a368;\n  --orange:#3cc48e;\n  --green:#15803d;\n  --danger:#e11d48;\n}\n\n/* ---------- view-transition (circular reveal) ---------- */\n::view-transition-old(root),\n::view-transition-new(root){animation:none;mix-blend-mode:normal;}\n::view-transition-old(root){z-index:1;}\n::view-transition-new(root){z-index:2;}\n\n/* fallback: gentle colour cross-fade when View Transitions are unavailable */\nhtml.theme-fade *,html.theme-fade *::before,html.theme-fade *::after{\n  transition:background-color .6s ease,border-color .6s ease,color .6s ease,box-shadow .6s ease,fill .6s ease !important;\n}\n\n/* ---------- toggle button ---------- */\n.theme-toggle{\n  width:40px;height:40px;border-radius:50%;\n  display:flex;align-items:center;justify-content:center;\n  background:var(--panel);color:var(--text);\n  border:1px solid var(--line);cursor:pointer;\n  box-shadow:0 6px 20px rgba(0,0,0,.18);\n  transition:transform .2s ease,border-color .2s ease,background-color .3s ease,color .3s ease;\n  flex-shrink:0;\n}\n.theme-toggle:hover{transform:scale(1.08);border-color:var(--violet);}\n.theme-toggle:active{transform:scale(.92);}\n.theme-toggle:focus-visible{outline:2px solid var(--violet);outline-offset:3px;}\n.theme-fixed{position:fixed;top:20px;right:24px;z-index:50;}\n.theme-header{width:32px;height:32px;box-shadow:none;background:var(--panel-2);}\n.theme-header .tt-icon{width:17px;height:17px;}\nbody[data-view=\"view-chat\"] .theme-fixed,\nbody[data-view=\"view-warp\"] .theme-fixed{display:none;}\n#header .h-right{display:flex;align-items:center;gap:14px;}\n.hub-top{right:80px;top:30px;}\n\n/* sun <-> moon morph */\n.tt-icon{width:22px;height:22px;overflow:visible;}\n.tt-core,.tt-rays,.tt-cut{transform-box:fill-box;transform-origin:center;}\n.tt-core{transition:transform .6s cubic-bezier(.22,1,.36,1);}\n.tt-cut{transition:transform .6s cubic-bezier(.22,1,.36,1);transform:translate(5px,-5px);}\n.tt-rays{transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .4s ease;transform:rotate(-90deg) scale(.3);opacity:0;transform-origin:12px 12px;transform-box:view-box;}\n.tt-core{transform-origin:12px 12px;transform-box:view-box;}\n.tt-cut{transform-box:view-box;}\n:root[data-theme=\"light\"] .tt-core{transform:rotate(90deg) scale(.58);}\n:root[data-theme=\"light\"] .tt-cut{transform:translate(18px,-18px);}\n:root[data-theme=\"light\"] .tt-rays{transform:rotate(0) scale(1);opacity:1;}\n\n/* =========================================================================\n   LIGHT THEME COMPONENT OVERRIDES\n   ========================================================================= */\n[data-theme=\"light\"] .theme-toggle{box-shadow:0 6px 18px rgba(16,90,64,.14);}\n\n/* ambient background */\n[data-theme=\"light\"] .aurora{mix-blend-mode:normal;opacity:.3;}\n[data-theme=\"light\"] .meteor{background:linear-gradient(90deg,rgba(13,143,108,0),rgba(13,143,108,.8) 60%,rgba(13,143,108,0));}\n[data-theme=\"light\"] .rainbow-text{background-image:linear-gradient(90deg,#0d8f6c,#12a368,#34b37a,#65a30d,#0d8f6c);}\n\n/* auth */\n[data-theme=\"light\"] .auth-card{background:rgba(255,255,255,.85);box-shadow:0 20px 50px rgba(16,90,64,.12);}\n[data-theme=\"light\"] .auth-card::before{opacity:.28;}\n[data-theme=\"light\"] .auth-card::after{background:linear-gradient(160deg,rgba(13,143,108,.35),transparent 40%);}\n[data-theme=\"light\"] .btn-ghost{background:rgba(255,255,255,.6);}\n[data-theme=\"light\"] .btn-ghost:hover{border-color:#8fc9b0;background:var(--panel-2);}\n\n/* hub */\n[data-theme=\"light\"] .model-card:hover{box-shadow:0 18px 40px rgba(16,90,64,.16);}\n[data-theme=\"light\"] .model-spotlight{background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(13,143,108,.12),transparent 65%);}\n[data-theme=\"light\"] .model-cta.launch{color:var(--text);}\n[data-theme=\"light\"] .model-glow{opacity:.22;}\n\n/* warp stays a dark \"space\" scene in both themes */\n[data-theme=\"light\"] #view-warp{background:#04120e;}\n[data-theme=\"light\"] .warp-caption{color:#8fb3a4;}\n\n/* sidebar */\n[data-theme=\"light\"] #sidebar{background:#ffffff;box-shadow:2px 0 24px rgba(16,90,64,.06);}\n[data-theme=\"light\"] .new-chat-btn{color:var(--text);}\n[data-theme=\"light\"] .profile-card:hover,\n[data-theme=\"light\"] .toggle-card:hover,\n[data-theme=\"light\"] .credit-card:hover{border-color:var(--violet);}\n[data-theme=\"light\"] .toggle-slider{background:#bcd8cb;}\n[data-theme=\"light\"] .toggle-switch input:checked + .toggle-slider{background:var(--violet);}\n[data-theme=\"light\"] .bar-track{background:rgba(11,42,31,.1);}\n\n/* header / chat */\n[data-theme=\"light\"] #header{background:rgba(255,255,255,.75);border-bottom-color:var(--line);}\n[data-theme=\"light\"] .user-avatar{background:#d5ebe0;color:var(--text);}\n[data-theme=\"light\"] .think-bar{background:#f6fbf8;}\n[data-theme=\"light\"] .think-header{color:#2f5244;}\n[data-theme=\"light\"] .think-content{color:#4a695b;}\n[data-theme=\"light\"] .meta-tag{color:#5a7a6b;}\n[data-theme=\"light\"] .copy-msg-btn:hover,\n[data-theme=\"light\"] .code-box-header button:hover{color:var(--text);border-color:var(--violet);}\n[data-theme=\"light\"] .src-chip:hover{border-color:var(--violet);}\n[data-theme=\"light\"] .code-box{background:#f1f8f4;}\n[data-theme=\"light\"] .code-box pre{color:#12382a;}\n\n/* input */\n[data-theme=\"light\"] .input-box{background:rgba(255,255,255,.85);border-color:var(--line);box-shadow:0 18px 40px rgba(16,90,64,.12);}\n[data-theme=\"light\"] .input-box input{color:var(--text);}\n[data-theme=\"light\"] .input-box input::placeholder{color:#7a978a;}\n[data-theme=\"light\"] .input-box button{background:rgba(11,42,31,.1);color:var(--text);}\n[data-theme=\"light\"] .input-box button.active{background:var(--grad);color:#0a0a0d;}\n\n/* empty state + chips */\n[data-theme=\"light\"] .eyebrow{background:rgba(13,143,108,.08);border-color:rgba(13,143,108,.22);}\n[data-theme=\"light\"] .eyebrow b{color:var(--text);}\n[data-theme=\"light\"] .chip{background:rgba(255,255,255,.7);border-color:var(--line);}\n[data-theme=\"light\"] .chip:hover{background:#fff;border-color:var(--violet);box-shadow:0 10px 24px rgba(16,90,64,.12);}\n[data-theme=\"light\"] .pill{background:rgba(13,143,108,.08);border-color:rgba(13,143,108,.22);color:#0b6f53;}\n\n/* router chips */\n[data-theme=\"light\"] .router-step{background:rgba(13,143,108,.06);border-color:var(--line);}\n[data-theme=\"light\"] .router-step b{color:var(--text);}\n[data-theme=\"light\"] .router-step.active b{color:#0a0a0d;}\n[data-theme=\"light\"] .router-flow.scanning .router-step{animation-name:scanChipLight;}\n@keyframes scanChipLight{0%,60%,100%{border-color:var(--line);color:var(--text-dim);}25%{border-color:var(--violet);color:var(--text);box-shadow:0 0 14px rgba(13,143,108,.3);}}\n\n/* meta + deltas */\n[data-theme=\"light\"] .meta-pill{background:rgba(255,255,255,.85);border-color:var(--line);}\n[data-theme=\"light\"] .delta.neg{color:#e11d48;}\n\n/* overlay on mobile sidebar */\n[data-theme=\"light\"] #sidebar-overlay{background:rgba(11,42,31,.35);}\n\n@media (max-width:520px){\n  .theme-fixed{top:14px;right:14px;}\n  .hub-top{right:66px;top:22px;}\n}\n\n\n/* =========================================================================\n   CHAT HISTORY (sidebar)\n   ========================================================================= */\n#sidebar{overflow-y:auto;}\n.history-search{margin-top:10px;}\n.history-search input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--text);font-size:12.5px;outline:none;transition:border-color .15s;}\n.history-search input:focus{border-color:var(--violet);}\n.history-search input::placeholder{color:var(--text-dim);}\n.history-list{flex:1 1 160px;min-height:160px;overflow-y:auto;margin:0 -6px;padding:0 6px;display:flex;flex-direction:column;gap:2px;}\n.hist-group{font-size:10.5px;color:var(--text-dim);letter-spacing:.03em;margin:10px 6px 4px;}\n.hist-group:first-child{margin-top:2px;}\n.history-empty{color:var(--text-dim);font-size:12.5px;line-height:1.5;padding:10px 8px;}\n.hist-item{position:relative;display:flex;align-items:center;gap:6px;padding:8px 6px 8px 10px;border-radius:9px;color:var(--text-dim);font-size:13px;cursor:pointer;outline:none;transition:background .15s,color .15s;}\n.hist-item:hover,.hist-item:focus-visible{background:var(--panel-2);color:var(--text);}\n.hist-item:focus-visible{box-shadow:0 0 0 2px var(--violet) inset;}\n.hist-item.active{background:var(--panel-2);color:var(--text);}\n.hist-item.active::before{content:\"\";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--grad);}\n.hist-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n.hist-actions{display:flex;gap:1px;opacity:0;transition:opacity .15s;}\n.hist-item:hover .hist-actions,.hist-item:focus-within .hist-actions,.hist-item.active .hist-actions{opacity:1;}\n@media (hover:none){.hist-actions{opacity:1;}}\n.hist-act{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--text-dim);border-radius:6px;cursor:pointer;transition:background .12s,color .12s;}\n.hist-act:hover{background:var(--line);color:var(--text);}\n.hist-act.danger:hover{color:var(--danger);}\n.hist-rename{flex:1;min-width:0;background:var(--void);border:1px solid var(--violet);border-radius:6px;padding:3px 7px;color:var(--text);font:inherit;font-size:13px;outline:none;}\n\n\n/* ---- splash: \"(public release)\" shares the title's size + animated gradient ---- */\n.splash-wordmark{display:block;text-align:center;}\n.splash-wordmark .rainbow-text{font-size:clamp(28px,5.6vw,112px);line-height:1.05;white-space:nowrap;}\n.splash-wordmark .rainbow-text .pr{font:inherit;color:inherit;}\n@media (max-width:760px){\n  .splash-wordmark .rainbow-text{font-size:clamp(44px,15vw,90px);white-space:normal;}\n  .splash-wordmark .rainbow-text .pr{display:block;font-size:.5em;margin-top:.1em;}\n}\n\n/* ---- splash: alpha warning (compact glass card) ---- */\n.splash-warn{\n  position:absolute;left:50%;bottom:12%;transform:translateX(-50%);\n  width:max-content;max-width:min(92%,720px);\n  display:flex;gap:12px;align-items:center;\n  padding:11px 18px 11px 12px;border-radius:14px;\n  font-size:13.5px;line-height:1.45;text-align:left;\n  color:#04372a;\n  background:linear-gradient(135deg,rgba(236,253,245,.96),rgba(200,244,225,.92));\n  border:1px solid rgba(4,55,42,.18);border-left:4px solid #10a37f;\n  box-shadow:0 10px 30px rgba(0,0,0,.28);\n}\n.splash-warn b{color:#032a20;font-weight:700;}\n.splash-warn .warn-ico{\n  flex-shrink:0;width:26px;height:26px;border-radius:50%;\n  display:flex;align-items:center;justify-content:center;\n  background:#04372a;color:#b9f5df;font:700 14px 'Space Grotesk',sans-serif;\n}\n@media (max-width:760px){.splash-warn{bottom:10%;font-size:12.5px;}}\n<\/style>\n<style>/* Regen 1o app \u2014 mobile & tablet layer. Load AFTER Style.css.\n   Desktop (>1024px) is untouched; splash / warp / aurora / meteor animations are not modified. */\n.jt-jump,.jt-edge{display:none}\n\n@media (max-width:1024px){\n  :root{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}\n\n  /* keyboard-aware: --vvh / --input-h are set by app-mobile.js from visualViewport */\n  #view-chat{bottom:auto;height:var(--vvh,100dvh)}\n  #header{height:auto;min-height:52px;padding-top:var(--safe-t);\n    padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}\n  #menuToggle{display:grid;place-items:center;width:44px;height:44px;margin-left:-8px;font-size:22px;border-radius:12px}\n  #menuToggle:active{background:var(--panel-2)}\n  #empty-state{top:calc(52px + var(--safe-t));bottom:var(--input-h,96px);\n    padding:16px clamp(14px,4vw,32px);-webkit-overflow-scrolling:touch}\n  #chat-flow{padding:16px 0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}\n  #input-container{margin-bottom:calc(10px + var(--safe-b));\n    padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}\n  .input-box{padding:8px 10px 8px 16px;border-radius:20px}\n  .input-box input{font-size:16px;min-height:36px}      /* 16px stops iOS zooming on focus */\n  .input-box button{width:40px;height:40px}\n  .input-note{font-size:10.5px;line-height:1.35;margin-top:6px}\n\n  /* drawer */\n  #sidebar{width:min(86vw,320px);padding-top:calc(14px + var(--safe-t));padding-bottom:calc(14px + var(--safe-b));\n    overscroll-behavior:contain;will-change:transform}\n  .side-link,.new-chat-btn,.hist-item{min-height:44px}\n  .hist-act{width:34px;height:34px}\n\n  /* long answers never push the layout sideways */\n  .bubble-container{overflow-wrap:anywhere}\n  .bot-bubble pre,.code-box pre{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}\n  .bot-bubble table{display:block;max-width:100%;overflow-x:auto}\n\n  /* login + model hub: scroll instead of clipping on short screens, stay centred when they fit */\n  #view-auth.active,#view-hub.active{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;\n    padding-top:calc(64px + var(--safe-t));padding-bottom:calc(24px + var(--safe-b))}\n  .auth-card{margin:auto}\n  .hub-head{margin-top:auto}\n  .model-grid{margin-bottom:auto}\n\n  /* jump-to-latest pill */\n  .jt-jump{display:flex;align-items:center;gap:6px;position:absolute;left:50%;bottom:calc(var(--input-h,96px) + 12px);z-index:6;\n    padding:9px 14px 9px 12px;border-radius:99px;border:1px solid rgba(110,231,183,.28);\n    background:rgba(8,26,20,.84);color:var(--text);font:600 12.5px Inter,sans-serif;\n    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);\n    opacity:0;pointer-events:none;transform:translate(-50%,12px);\n    transition:opacity .25s,transform .35s cubic-bezier(.16,1,.3,1)}\n  .jt-jump.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}\n  .jt-jump svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n  [data-theme=\"light\"] .jt-jump{background:rgba(255,255,255,.92);border-color:var(--line);box-shadow:0 8px 24px rgba(16,90,64,.16)}\n}\n\n@media (max-width:900px){\n  /* edge grabber: pulses twice the first time, hints that the drawer can be swiped open */\n  body[data-view=\"view-chat\"] .jt-edge{display:block;position:fixed;left:3px;top:50%;width:4px;height:44px;margin-top:-22px;\n    border-radius:4px;background:var(--grad);z-index:4;pointer-events:none;opacity:0;\n    animation:jtEdge 1.6s ease-in-out 1s 2}\n  @keyframes jtEdge{0%,100%{opacity:0;transform:translateX(-6px)}35%,65%{opacity:.9;transform:none}}\n}\n@media (max-width:760px){\n  .brand-row{top:calc(20px + var(--safe-t))}\n  .theme-fixed{top:calc(14px + var(--safe-t))}\n  .hub-top{top:calc(22px + var(--safe-t))}\n}\n@media (max-width:520px){.brand-row{left:16px}}\n\n/* touch: no sticky hover lifts, press feedback instead */\n@media (hover:none){\n  .model-card:hover,.chip:hover,.profile-card:hover,.toggle-card:hover,.credit-card:hover{transform:none}\n  .chip:active,.model-card:not(.disabled):active,.btn:active,.new-chat-btn:active{transform:scale(.97)}\n}\n\n/* landscape phones */\n@media (max-height:520px){\n  .splash-hint{display:none}\n  .splash-warn{bottom:4%}\n  .chip-grid{grid-template-columns:repeat(2,1fr)}\n}\n<\/style>\n<style>/* Custom line-icon set (replaces emoji / unicode glyph icons). Load after the main stylesheet. */\n.ic{width:1em;height:1em;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}\n.feat-icon .ic{width:18px;height:18px}\n.feat-card .feat-icon{color:#fff}\nbody.dark-mode .feat-card .feat-icon{color:#03130f}\n.eyebrow .ic{width:14px;height:14px;color:var(--pink)}\n.side-link .ic{width:16px;height:16px}\n.new-chat-btn .ic{width:16px;height:16px;margin-right:8px;vertical-align:-3px}\n<\/style>\n<\/head>\n<body>\n\n<canvas id=\"starfield\"><\/canvas>\n\n<div class=\"aurora-layer\" aria-hidden=\"true\">\n  <div class=\"aurora a1\"><\/div>\n  <div class=\"aurora a2\"><\/div>\n  <div class=\"aurora a3\"><\/div>\n<\/div>\n\n<div class=\"meteor-layer\" aria-hidden=\"true\">\n  <span class=\"meteor\" style=\"--top:4%;  --delay:0s;   --dur:5.5s;\"><\/span>\n  <span class=\"meteor\" style=\"--top:18%; --delay:1.6s; --dur:6.2s;\"><\/span>\n  <span class=\"meteor\" style=\"--top:34%; --delay:3.1s; --dur:5s;\"><\/span>\n  <span class=\"meteor\" style=\"--top:52%; --delay:0.7s; --dur:6.8s;\"><\/span>\n  <span class=\"meteor\" style=\"--top:68%; --delay:2.3s; --dur:5.4s;\"><\/span>\n  <span class=\"meteor\" style=\"--top:82%; --delay:4s;   --dur:6s;\"><\/span>\n<\/div>\n\n<!-- Theme toggle for splash / auth / hub (hidden in chat, which has its own in the header) -->\n<button class=\"theme-toggle theme-fixed\" type=\"button\" aria-label=\"Toggle light / dark theme\" title=\"Switch theme\">\n  <svg class=\"tt-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n    <g class=\"tt-rays\"><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/><\/g>\n    <g class=\"tt-core\"><mask id=\"ttm1\"><rect width=\"24\" height=\"24\" fill=\"#fff\"/><circle class=\"tt-cut\" cx=\"18\" cy=\"6\" r=\"6\" fill=\"#000\"/><\/mask><circle cx=\"12\" cy=\"12\" r=\"6\" fill=\"currentColor\" stroke=\"none\" mask=\"url(#ttm1)\"/><\/g>\n  <\/svg>\n<\/button>\n\n<!-- ============ SPLASH VIEW ============ -->\n<div id=\"view-splash\" class=\"view active\">\n  <div class=\"splash-wrap\">\n    <div class=\"splash-wordmark\" id=\"splashWordmark\">\n      <h1 class=\"rainbow-text\">REGEN 1o <span class=\"pr\">(public release)<\/span><\/h1>\n    <\/div>\n    <p class=\"splash-sub\">Just Talk \u2014 an AI that thinks out loud<\/p>\n  <\/div>\n  <div class=\"splash-marquee\" aria-hidden=\"true\"><div class=\"marquee\"><div class=\"mq-track\">\n    <span>ROUTE <b>\u2192<\/b> VERIFY <b>\u2192<\/b> REASON <b>\u2192<\/b> ANSWER <b>+<\/b> LIVE WEB SEARCH <b>+<\/b> VISIBLE REASONING <b>+<\/b> PERSISTENT CREDITS <b>+<\/b><\/span>\n    <span>ROUTE <b>\u2192<\/b> VERIFY <b>\u2192<\/b> REASON <b>\u2192<\/b> ANSWER <b>+<\/b> LIVE WEB SEARCH <b>+<\/b> VISIBLE REASONING <b>+<\/b> PERSISTENT CREDITS <b>+<\/b><\/span>\n  <\/div><\/div><\/div>\n  <div class=\"splash-warn\" role=\"note\">\n    <span class=\"warn-ico\">!<\/span>\n    <span><b>Heads up:<\/b> Regen 1o can give wrong answers because it runs on an <b>alpha variant<\/b> of the model. Double-check anything important.<\/span>\n  <\/div>\n  <div class=\"splash-hint\">Tap anywhere to enter \u219d<\/div>\n<\/div>\n\n<!-- ============ AUTH VIEW ============ -->\n<div id=\"view-auth\" class=\"view\">\n  <div class=\"brand-row\"><span class=\"brand-dot\"><\/span><span class=\"brand-name\">Just Talk<\/span><a class=\"site-link\" href=\"index.html\">\u2190 Website<\/a><\/div>\n\n  <div class=\"auth-card\">\n    <div class=\"auth-eyebrow\">REGEN 1o \u00b7 PUBLIC RELEASE<\/div>\n    <h1 class=\"auth-title\">Think out loud with an AI that shows its work.<\/h1>\n    <p class=\"auth-sub\">Live web verification, visible reasoning, and a credit system that keeps answers honest.<\/p>\n\n    <div class=\"auth-tabs\">\n      <button class=\"auth-tab active\" id=\"tabSignIn\">Sign in<\/button>\n      <button class=\"auth-tab\" id=\"tabSignUp\">Sign up<\/button>\n    <\/div>\n\n    <div id=\"authFields\">\n      <div class=\"field\">\n        <label for=\"authUser\">Username<\/label>\n        <input type=\"text\" id=\"authUser\" placeholder=\"e.g. ada\" autocomplete=\"username\">\n      <\/div>\n      <div class=\"field\">\n        <label for=\"authPass\">Password<\/label>\n        <input type=\"password\" id=\"authPass\" placeholder=\"\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\" autocomplete=\"current-password\">\n      <\/div>\n    <\/div>\n\n    <button class=\"btn btn-primary\" id=\"authSubmit\">Sign in<\/button>\n    <div class=\"auth-error\" id=\"authError\"><\/div>\n\n    <div class=\"auth-divider\">or<\/div>\n    <button class=\"btn btn-ghost\" id=\"guestBtn\">Continue as guest<\/button>\n  <\/div>\n<\/div>\n\n<!-- ============ HUB VIEW ============ -->\n<div id=\"view-hub\" class=\"view\">\n  <div class=\"hub-top\">\n    <span class=\"hub-user\" id=\"hubUserLabel\">Guest<\/span>\n    <button class=\"logout-link\" id=\"hubLogout\">Sign out<\/button>\n  <\/div>\n\n  <div class=\"hub-head\">\n    <h2>Choose your model<\/h2>\n    <p>Pick which engine powers your conversation.<\/p>\n  <\/div>\n\n  <div class=\"model-grid\">\n    <div class=\"model-card\" id=\"cardAlpha\">\n      <div class=\"model-glow\"><\/div>\n      <div class=\"model-spotlight\"><\/div>\n      <div class=\"model-badge\">\u25cf ONLINE \u00b7 PUBLIC RELEASE<\/div>\n      <h3>Regen 1o<\/h3>\n      <p>GPT\u2011OSS\u201120B via Groq, with live web verification and a visible credit &amp; reasoning trail. Runs on an alpha variant, so answers can be wrong.<\/p>\n      <div class=\"model-cta launch\">Launch \u2197<\/div>\n    <\/div>\n\n    <div class=\"model-card disabled\" id=\"cardAdaptive\">\n      <div class=\"model-glow\"><\/div>\n      <div class=\"model-spotlight\"><\/div>\n      <div class=\"model-badge\">COMING SOON<\/div>\n      <h3>Regen Adaptive<\/h3>\n      <p>A self-tuning successor model that adapts its reasoning depth to each question. In development.<\/p>\n      <div class=\"model-cta soon\">Not yet available<\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ============ WARP TRANSITION ============ -->\n<div id=\"view-warp\" class=\"view\">\n  <canvas id=\"warp-canvas\"><\/canvas>\n  <div class=\"warp-flash\"><\/div>\n  <div class=\"warp-caption\">Piercing into Regen 1o\u2026<\/div>\n<\/div>\n\n<!-- ============ CHAT VIEW ============ -->\n<div id=\"view-chat\" class=\"view\">\n  <div id=\"app-shell\">\n    <div id=\"sidebar-overlay\"><\/div>\n    <div id=\"sidebar\">\n      <button id=\"newChatBtn\" class=\"new-chat-btn\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/><\/svg>New chat<\/button>\n\n      <!-- Chat history -->\n      <div class=\"side-section-title\">Chats<\/div>\n      <div class=\"history-search\">\n        <input type=\"text\" id=\"historySearch\" placeholder=\"Search chats\u2026\" autocomplete=\"off\" aria-label=\"Search chats\">\n      <\/div>\n      <div class=\"history-list\" id=\"historyList\" aria-label=\"Chat history\"><\/div>\n\n      <div class=\"side-section-title\">Menu<\/div>\n      <button class=\"side-link\" id=\"backToHub\"><span class=\"ico\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 7h11l-3-3M17 17H6l3 3\"/><\/svg><\/span> Switch model<\/button>\n      <button class=\"side-link\" id=\"aboutBtn\"><span class=\"ico\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><path d=\"M12 11v5M12 8h.01\"/><\/svg><\/span> About Regen 1o<\/button>\n      <button class=\"side-link\" id=\"clearHistoryBtn\"><span class=\"ico\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 7h14M9 7V4.5h6V7M7 7l1 13h8l1-13\"/><\/svg><\/span> Delete all chats<\/button>\n\n      <div class=\"side-bottom\">\n        <div class=\"profile-card\">\n          <div class=\"avatar-sm\" id=\"profileAvatar\">G<\/div>\n          <div class=\"profile-meta\">\n            <div class=\"profile-name\" id=\"profileName\">Guest<\/div>\n            <div class=\"profile-plan\">Free tier<\/div>\n          <\/div>\n        <\/div>\n        <div class=\"toggle-card\">\n          <div class=\"label\">Web Search<\/div>\n          <label class=\"toggle-switch\">\n            <input type=\"checkbox\" id=\"webSearchToggle\" checked>\n            <span class=\"toggle-slider\"><\/span>\n          <\/label>\n        <\/div>\n        <div class=\"credit-card\">\n          <div class=\"credit-card-title\">System Credits<\/div>\n          <div id=\"creditDisplay\" class=\"credit-value\">1000<\/div>\n          <div class=\"bar-track\"><div class=\"bar-fill\" id=\"creditBar\" style=\"width:100%\"><\/div><\/div>\n        <\/div>\n        <button class=\"side-link\" id=\"logoutBtn\" style=\"border:1px solid var(--line);\"><span class=\"ico\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M10 4H5v16h5M15 8l4 4-4 4M19 12H9\"/><\/svg><\/span> Sign out<\/button>\n      <\/div>\n    <\/div>\n\n    <div id=\"main-container\">\n      <div id=\"header\">\n        <div class=\"h-left\">\n          <button id=\"menuToggle\" aria-label=\"Open menu\">\u2630<\/button>\n          <span class=\"brand-mark\">R<\/span><span class=\"hdr-title\">Regen 1o<\/span><span class=\"hdr-badge\">public release<\/span>\n        <\/div>\n        <div class=\"h-right\">\n          <span class=\"h-status\">Web Engine Active<\/span>\n          <button class=\"theme-toggle theme-header\" type=\"button\" aria-label=\"Toggle light / dark theme\" title=\"Switch theme\">\n            <svg class=\"tt-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n              <g class=\"tt-rays\"><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/><\/g>\n              <g class=\"tt-core\"><mask id=\"ttm2\"><rect width=\"24\" height=\"24\" fill=\"#fff\"/><circle class=\"tt-cut\" cx=\"18\" cy=\"6\" r=\"6\" fill=\"#000\"/><\/mask><circle cx=\"12\" cy=\"12\" r=\"6\" fill=\"currentColor\" stroke=\"none\" mask=\"url(#ttm2)\"/><\/g>\n            <\/svg>\n          <\/button>\n        <\/div>\n      <\/div>\n\n      <div id=\"empty-state\">\n        <div class=\"eyebrow\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M13 3 5 13.5h6L10 21l8-10.5h-6z\"/><\/svg> <b>20B parameters<\/b> \u00b7 Groq-hosted inference<\/div>\n        <h1>Agent-grade reasoning.<br><span class=\"hl\">Groq-grade speed.<\/span><\/h1>\n        <p class=\"lead\">Every message is routed, verified against the live web, and shipped with its reasoning. Try one:<\/p>\n        <div class=\"chip-grid\">\n          <button class=\"chip\" data-q=\"What's today's date?\"><span class=\"feat-icon\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><path d=\"M12 7.5V12l3 2\"/><\/svg><\/span><b>What's today's date?<\/b><span class=\"pill\">01 Temporal<\/span><\/button>\n          <button class=\"chip\" data-q=\"Who are you?\"><span class=\"feat-icon\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"9\" r=\"3.5\"/><path d=\"M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5\"/><\/svg><\/span><b>Who are you?<\/b><span class=\"pill\">02 Identity<\/span><\/button>\n          <button class=\"chip\" data-q=\"Write a 100 word paragraph on black holes\"><span class=\"feat-icon\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z\"/><path d=\"M14.5 6.5l3 3\"/><\/svg><\/span><b>Write a 100 word paragraph on black holes<\/b><span class=\"pill\">03 Generation<\/span><\/button>\n          <button class=\"chip\" data-q=\"Who founded Tesla?\"><span class=\"feat-icon\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><path d=\"M3.5 12h17M12 3.5c2.4 2.4 3.5 5.2 3.5 8.5s-1.1 6.1-3.5 8.5c-2.4-2.4-3.5-5.2-3.5-8.5s1.1-6.1 3.5-8.5z\"/><\/svg><\/span><b>Who founded Tesla?<\/b><span class=\"pill\">04 Factual<\/span><\/button>\n        <\/div>\n      <\/div>\n\n      <div id=\"chat-flow\"><\/div>\n\n      <div id=\"input-container\">\n        <div class=\"input-box\">\n          <input type=\"text\" id=\"userInput\" placeholder=\"Message Regen 1o...\">\n          <button id=\"sendBtn\" aria-label=\"Send\">\u2191<\/button>\n        <\/div>\n        <div class=\"input-note\">\u26a0 Regen 1o runs on an alpha variant and can give wrong answers. Verify important info.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<script>/* =========================================================================\n   REGEN 1 ALPHA \u2014 client\n   Views: auth -> hub -> warp transition -> chat\n   ========================================================================= */\n\nconst API_URL = \"https://justtalk-1o.onrender.com/chat\";\nconst LS_ACCOUNTS = \"jt_accounts\";     // { username: password }  (local demo auth only)\nconst LS_SESSION  = \"jt_session\";      // { username, guest }\nconst LS_HISTORY  = \"jt_chat_history\"; // persisted chat history\n\n// ---------------------------------------------------------------------\n// Background: connected-node network (same as landing.html \"netCanvas\"),\n// orange nodes, cursor-reactive. Paused while the chat view is open.\n// ---------------------------------------------------------------------\nconst starCanvas = document.getElementById(\"starfield\");\nconst starCtx = starCanvas.getContext(\"2d\");\nlet netNodes = [];\nconst netMouse = { x: -9999, y: -9999 };\n\nfunction initNet() {\n  starCanvas.width = window.innerWidth;\n  starCanvas.height = window.innerHeight;\n  const count = Math.min(110, Math.floor((starCanvas.width * starCanvas.height) / 18000));\n  netNodes = [];\n  for (let i = 0; i < count; i++) {\n    netNodes.push({\n      x: Math.random() * starCanvas.width,\n      y: Math.random() * starCanvas.height,\n      vx: (Math.random() - 0.5) * 0.25,\n      vy: (Math.random() - 0.5) * 0.25\n    });\n  }\n}\n// Colours for the node network follow the active theme.\nlet netLine = \"167,243,208\", netNode = \"rgba(110,231,183,0.7)\", netLineAlpha = 0.12;\nfunction syncNetColors() {\n  const light = document.documentElement.getAttribute(\"data-theme\") === \"light\";\n  netLine = light ? \"13,143,108\" : \"167,243,208\";\n  netNode = light ? \"rgba(13,143,108,0.55)\" : \"rgba(110,231,183,0.7)\";\n  netLineAlpha = light ? 0.2 : 0.12;\n}\nsyncNetColors();\nfunction drawNet() {\n  requestAnimationFrame(drawNet);\n  const chatView = document.getElementById(\"view-chat\");\n  if (chatView && chatView.classList.contains(\"active\")) return; // hidden behind chat, save CPU\n\n  const w = starCanvas.width, h = starCanvas.height;\n  starCtx.clearRect(0, 0, w, h);\n  for (const n of netNodes) {\n    n.x += n.vx; n.y += n.vy;\n    if (n.x < 0 || n.x > w) n.vx *= -1;\n    if (n.y < 0 || n.y > h) n.vy *= -1;\n    const dx = n.x - netMouse.x, dy = n.y - netMouse.y;\n    const dist = Math.sqrt(dx * dx + dy * dy);\n    if (dist < 140 && dist > 0) { n.x += dx / dist * 0.6; n.y += dy / dist * 0.6; }\n  }\n  for (let i = 0; i < netNodes.length; i++) {\n    for (let j = i + 1; j < netNodes.length; j++) {\n      const a = netNodes[i], b = netNodes[j];\n      const d = Math.hypot(a.x - b.x, a.y - b.y);\n      if (d < 120) {\n        starCtx.strokeStyle = `rgba(${netLine},${netLineAlpha * (1 - d / 120)})`;\n        starCtx.lineWidth = 1;\n        starCtx.beginPath(); starCtx.moveTo(a.x, a.y); starCtx.lineTo(b.x, b.y); starCtx.stroke();\n      }\n    }\n  }\n  starCtx.fillStyle = netNode;\n  for (const n of netNodes) {\n    starCtx.beginPath(); starCtx.arc(n.x, n.y, 2, 0, Math.PI * 2); starCtx.fill();\n  }\n}\ninitNet();\ndrawNet();\nwindow.addEventListener(\"resize\", initNet);\nwindow.addEventListener(\"mousemove\", e => { netMouse.x = e.clientX; netMouse.y = e.clientY; });\nwindow.addEventListener(\"mouseleave\", () => { netMouse.x = -9999; netMouse.y = -9999; });\n\n// ---------------------------------------------------------------------\n// View router\n// ---------------------------------------------------------------------\nfunction showView(id) {\n  document.querySelectorAll(\".view\").forEach(v => v.classList.remove(\"active\"));\n  document.getElementById(id).classList.add(\"active\");\n  document.body.dataset.view = id;\n}\n\n// ---------------------------------------------------------------------\n// Splash view (app wordmark) -> auth\n// ---------------------------------------------------------------------\nconst splashView = document.getElementById(\"view-splash\");\nfunction leaveSplash() {\n  // Splash always shows first; after the tap, logged-in users skip auth.\n  if (getSession()) enterHub();\n  else showView(\"view-auth\");\n}\nsplashView.addEventListener(\"click\", leaveSplash);\nwindow.addEventListener(\"keydown\", (e) => {\n  if (splashView.classList.contains(\"active\") && (e.key === \"Enter\" || e.key === \" \")) {\n    e.preventDefault();\n    leaveSplash();\n  }\n});\n\n// ---------------------------------------------------------------------\n// Session / mock auth\n// NOTE: there is no auth backend \u2014 this app only has a /chat endpoint.\n// Sign in / Sign up are a local, browser-only demo (credentials are\n// stored in this browser's localStorage, not on any server).\n// ---------------------------------------------------------------------\nfunction getAccounts() {\n  try { return JSON.parse(localStorage.getItem(LS_ACCOUNTS)) || {}; }\n  catch { return {}; }\n}\nfunction saveAccounts(a) { localStorage.setItem(LS_ACCOUNTS, JSON.stringify(a)); }\nfunction getSession() {\n  try { return JSON.parse(localStorage.getItem(LS_SESSION)); }\n  catch { return null; }\n}\nfunction setSession(s) { localStorage.setItem(LS_SESSION, JSON.stringify(s)); }\nfunction clearSession() { localStorage.removeItem(LS_SESSION); }\n\nlet authMode = \"signin\"; // or \"signup\"\n\nconst tabSignIn = document.getElementById(\"tabSignIn\");\nconst tabSignUp = document.getElementById(\"tabSignUp\");\nconst authSubmit = document.getElementById(\"authSubmit\");\nconst authError = document.getElementById(\"authError\");\nconst authUser = document.getElementById(\"authUser\");\nconst authPass = document.getElementById(\"authPass\");\n\ntabSignIn.addEventListener(\"click\", () => {\n  authMode = \"signin\";\n  tabSignIn.classList.add(\"active\");\n  tabSignUp.classList.remove(\"active\");\n  authSubmit.textContent = \"Sign in\";\n  authError.textContent = \"\";\n});\ntabSignUp.addEventListener(\"click\", () => {\n  authMode = \"signup\";\n  tabSignUp.classList.add(\"active\");\n  tabSignIn.classList.remove(\"active\");\n  authSubmit.textContent = \"Create account\";\n  authError.textContent = \"\";\n});\n\nauthSubmit.addEventListener(\"click\", () => {\n  const u = authUser.value.trim();\n  const p = authPass.value;\n  authError.textContent = \"\";\n\n  if (!u || !p) { authError.textContent = \"Enter a username and password.\"; return; }\n\n  const accounts = getAccounts();\n\n  if (authMode === \"signup\") {\n    if (accounts[u]) { authError.textContent = \"That username is already taken.\"; return; }\n    accounts[u] = p;\n    saveAccounts(accounts);\n    setSession({ username: u, guest: false });\n    enterHub();\n  } else {\n    if (!accounts[u] || accounts[u] !== p) {\n      authError.textContent = \"Incorrect username or password.\";\n      return;\n    }\n    setSession({ username: u, guest: false });\n    enterHub();\n  }\n});\n\ndocument.getElementById(\"guestBtn\").addEventListener(\"click\", () => {\n  setSession({ username: \"Guest\", guest: true });\n  enterHub();\n});\n\n[authUser, authPass].forEach(el => {\n  el.addEventListener(\"keydown\", e => { if (e.key === \"Enter\") authSubmit.click(); });\n});\n\n// ---------------------------------------------------------------------\n// Hub view\n// ---------------------------------------------------------------------\nfunction enterHub() {\n  const s = getSession();\n  document.getElementById(\"hubUserLabel\").textContent = s ? s.username : \"Guest\";\n  showView(\"view-hub\");\n}\n\ndocument.getElementById(\"hubLogout\").addEventListener(\"click\", doLogout);\ndocument.getElementById(\"logoutBtn\").addEventListener(\"click\", doLogout);\n\nfunction doLogout() {\n  clearSession();\n  authUser.value = \"\";\n  authPass.value = \"\";\n  showView(\"view-auth\");\n}\n\ndocument.getElementById(\"cardAlpha\").addEventListener(\"click\", () => runWarpThenChat());\n// Regen Adaptive card is inert on purpose (coming soon).\n\n// Cursor-follow spotlight highlight on the model cards.\ndocument.querySelectorAll(\".model-card\").forEach(card => {\n  card.addEventListener(\"mousemove\", (e) => {\n    const rect = card.getBoundingClientRect();\n    card.style.setProperty(\"--mx\", `${e.clientX - rect.left}px`);\n    card.style.setProperty(\"--my\", `${e.clientY - rect.top}px`);\n  });\n});\n\n// ---------------------------------------------------------------------\n// Warp transition (canvas starfield \"piercing\" through space)\n// ---------------------------------------------------------------------\nconst warpCanvas = document.getElementById(\"warp-canvas\");\nconst warpCtx = warpCanvas.getContext(\"2d\");\nlet warpStars = [];\nlet warpRAF = null;\nlet warpStartTime = 0;\nconst WARP_DURATION = 2600; // ms, matches the CSS flash/caption timing\n\nfunction initWarp() {\n  warpCanvas.width = window.innerWidth;\n  warpCanvas.height = window.innerHeight;\n  warpStars = [];\n  for (let i = 0; i < 700; i++) {\n    warpStars.push({\n      x: (Math.random() - 0.5) * warpCanvas.width,\n      y: (Math.random() - 0.5) * warpCanvas.height,\n      z: Math.random() * warpCanvas.width,\n      c: Math.floor(Math.random() * 3)\n    });\n  }\n  warpCtx.fillStyle = \"#04120e\";\n  warpCtx.fillRect(0, 0, warpCanvas.width, warpCanvas.height);\n}\n\n// Classic \"jump to lightspeed\" look: points near the centre barely move at\n// first, then accelerate outward into long white streaks as speed ramps up,\n// exactly like looking straight out the front window of a ship. No shapes,\n// no icons \u2014 just stars stretching into lines.\nfunction drawWarp(now) {\n  if (!warpStartTime) warpStartTime = now;\n  const elapsed = now - warpStartTime;\n  const progress = Math.min(1, elapsed / WARP_DURATION);\n  // ease-in acceleration curve: slow at first, screaming fast by the end\n  const speed = 4 + Math.pow(progress, 2.4) * 90;\n\n  const cx = warpCanvas.width / 2, cy = warpCanvas.height / 2;\n\n  // Lower alpha trail = longer streak lines as speed increases\n  const trailAlpha = 0.5 - progress * 0.35;\n  warpCtx.fillStyle = `rgba(4,18,14,${Math.max(0.12, trailAlpha)})`;\n  warpCtx.fillRect(0, 0, warpCanvas.width, warpCanvas.height);\n\n  for (const s of warpStars) {\n    const prevZ = s.z;\n    s.z -= speed;\n    if (s.z <= 1) {\n      s.x = (Math.random() - 0.5) * warpCanvas.width;\n      s.y = (Math.random() - 0.5) * warpCanvas.height;\n      s.z = warpCanvas.width;\n    }\n    const k = 128 / s.z;\n    const px = s.x * k + cx, py = s.y * k + cy;\n    const pk = 128 / prevZ;\n    const ppx = s.x * pk + cx, ppy = s.y * pk + cy;\n\n    const depthFactor = 1 - s.z / warpCanvas.width;\n    const size = Math.max(0.6, depthFactor * 2.4);\n    const brightness = 0.5 + depthFactor * 0.5;\n    const WARP_COLORS = [\"220,255,240\", \"110,231,183\", \"25,195,125\"];\n    warpCtx.strokeStyle = `rgba(${WARP_COLORS[s.c || 0]},${brightness})`;\n    warpCtx.lineWidth = size;\n    warpCtx.beginPath();\n    warpCtx.moveTo(ppx, ppy);\n    warpCtx.lineTo(px, py);\n    warpCtx.stroke();\n  }\n  warpRAF = requestAnimationFrame(drawWarp);\n}\n\nfunction runWarpThenChat() {\n  initWarp();\n  warpStartTime = 0;\n  showView(\"view-warp\");\n  warpRAF = requestAnimationFrame(drawWarp);\n  setTimeout(() => {\n    cancelAnimationFrame(warpRAF);\n    enterChat();\n  }, WARP_DURATION);\n}\n\n// ---------------------------------------------------------------------\n// Chat view bootstrap\n// ---------------------------------------------------------------------\nfunction enterChat() {\n  const s = getSession() || { username: \"Guest\", guest: true };\n  const initial = (s.username || \"G\").charAt(0).toUpperCase();\n  document.getElementById(\"profileAvatar\").textContent = initial;\n  document.getElementById(\"profileName\").textContent = s.username;\n  showView(\"view-chat\");\n  initConvos();\n  const hs = document.getElementById(\"historySearch\");\n  if (hs) { hs.value = \"\"; historyFilter = \"\"; }\n  renderHistoryList();\n  loadHistoryIntoUI();\n}\n\ndocument.getElementById(\"backToHub\").addEventListener(\"click\", () => {\n  closeSidebarMobile();\n  enterHub();\n});\ndocument.getElementById(\"aboutBtn\").addEventListener(\"click\", () => {\n  alert(\"Regen 1 Alpha runs GPT-OSS-20B via Groq with optional live web verification. System credits track answer reliability: verified or successful answers earn credits, and only genuine verification failures cost credits (going offline or turning search off never does).\");\n});\ndocument.getElementById(\"clearHistoryBtn\").addEventListener(\"click\", () => {\n  closeSidebarMobile();\n  clearAllConvos();\n});\n\n// ---------------------------------------------------------------------\n// Sidebar (mobile drawer)\n// ---------------------------------------------------------------------\nconst sidebarEl = document.getElementById(\"sidebar\");\nconst sidebarOverlay = document.getElementById(\"sidebar-overlay\");\nfunction openSidebarMobile() { sidebarEl.classList.add(\"open\"); sidebarOverlay.classList.add(\"show\"); }\nfunction closeSidebarMobile() { sidebarEl.classList.remove(\"open\"); sidebarOverlay.classList.remove(\"show\"); }\ndocument.getElementById(\"menuToggle\").addEventListener(\"click\", openSidebarMobile);\nsidebarOverlay.addEventListener(\"click\", closeSidebarMobile);\n\n// ---------------------------------------------------------------------\n// Chat logic\n// ---------------------------------------------------------------------\n// ---------------------------------------------------------------------\n// Conversations (chat history): many chats per user, saved in localStorage.\n// `chatHistory` is always an alias of the ACTIVE conversation's messages.\n// ---------------------------------------------------------------------\nconst LS_CONVOS = \"regen_convos_\";\nlet convoStore = { activeId: null, convos: [] };\nlet chatHistory = [];\nlet historyFilter = \"\";\n\nfunction convoKey() {\n  const s = getSession();\n  return LS_CONVOS + (s && !s.guest ? s.username : \"guest\");\n}\nfunction newId() { return \"c\" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }\nfunction makeConvo() {\n  const now = Date.now();\n  return { id: newId(), title: \"New chat\", titled: false, createdAt: now, updatedAt: now, messages: [] };\n}\nfunction activeConvo() { return convoStore.convos.find(c => c.id === convoStore.activeId) || null; }\nfunction titleFrom(msgs) {\n  const first = msgs.find(m => m.role === \"user\");\n  if (!first) return \"New chat\";\n  const t = first.content.replace(/\\s+/g, \" \").trim();\n  return t.length > 42 ? t.slice(0, 42).trimEnd() + \"\u2026\" : t;\n}\nfunction stopStream() { if (window.__stream) window.__stream.finish(); }\n\nfunction saveConvos() {\n  try {\n    const keep = convoStore.convos.filter(c => c.messages.length || c.id === convoStore.activeId);\n    localStorage.setItem(convoKey(), JSON.stringify({ activeId: convoStore.activeId, convos: keep }));\n  } catch (e) {}\n}\n\nfunction initConvos() {\n  convoStore = { activeId: null, convos: [] };\n  try {\n    const saved = JSON.parse(localStorage.getItem(convoKey()));\n    if (saved && Array.isArray(saved.convos)) convoStore = { activeId: saved.activeId, convos: saved.convos };\n  } catch (e) {}\n\n  // One-time migration of the old single-conversation history.\n  if (!convoStore.convos.length) {\n    try {\n      const legacy = JSON.parse(localStorage.getItem(LS_HISTORY));\n      if (Array.isArray(legacy) && legacy.length) {\n        const c = makeConvo();\n        c.messages = legacy;\n        c.title = titleFrom(legacy);\n        convoStore.convos.push(c);\n        convoStore.activeId = c.id;\n        localStorage.removeItem(LS_HISTORY);\n      }\n    } catch (e) {}\n  }\n\n  convoStore.convos = convoStore.convos.filter(c => c.messages.length || c.id === convoStore.activeId);\n  if (!activeConvo()) {\n    const c = makeConvo();\n    convoStore.convos.push(c);\n    convoStore.activeId = c.id;\n  }\n  chatHistory = activeConvo().messages;\n  saveConvos();\n}\n\n// Call after changing a conversation's messages.\nfunction persistConvo(c) {\n  if (!c || !convoStore.convos.includes(c)) return; // deleted while a reply was in flight\n  if (c.messages.length > 300) c.messages.splice(0, c.messages.length - 300);\n  c.updatedAt = Date.now();\n  if (!c.titled) c.title = titleFrom(c.messages);\n  saveConvos();\n  renderHistoryList();\n}\n\nfunction switchConvo(id) {\n  if (id === convoStore.activeId) { closeSidebarMobile(); return; }\n  if (!convoStore.convos.some(c => c.id === id)) return;\n  stopStream();\n  convoStore.activeId = id;\n  chatHistory = activeConvo().messages;\n  saveConvos();\n  loadHistoryIntoUI();\n  renderHistoryList();\n  closeSidebarMobile();\n}\n\nfunction newConvo() {\n  stopStream();\n  const cur = activeConvo();\n  if (!cur || cur.messages.length) {\n    const c = makeConvo();\n    convoStore.convos.push(c);\n    convoStore.activeId = c.id;\n    chatHistory = c.messages;\n  }\n  saveConvos();\n  loadHistoryIntoUI();\n  renderHistoryList();\n  closeSidebarMobile();\n  const input = document.getElementById(\"userInput\");\n  if (input) input.focus();\n}\n\nfunction resetToFreshIfNeeded(wasActive) {\n  if (!wasActive) return;\n  stopStream();\n  const next = convoStore.convos.filter(c => c.messages.length).sort((a, b) => b.updatedAt - a.updatedAt)[0];\n  if (next) convoStore.activeId = next.id;\n  else {\n    const c = makeConvo();\n    convoStore.convos.push(c);\n    convoStore.activeId = c.id;\n  }\n  chatHistory = activeConvo().messages;\n  loadHistoryIntoUI();\n}\n\nfunction deleteConvo(id) {\n  const c = convoStore.convos.find(x => x.id === id);\n  if (!c) return;\n  if (!confirm(`Delete \"${c.title}\"? This can't be undone.`)) return;\n  const wasActive = id === convoStore.activeId;\n  convoStore.convos = convoStore.convos.filter(x => x.id !== id);\n  resetToFreshIfNeeded(wasActive);\n  saveConvos();\n  renderHistoryList();\n}\n\nfunction clearAllConvos() {\n  if (!confirm(\"Delete ALL your chats? This can't be undone.\")) return;\n  convoStore.convos = [];\n  resetToFreshIfNeeded(true);\n  saveConvos();\n  renderHistoryList();\n}\n\nfunction startRename(item) {\n  const c = convoStore.convos.find(x => x.id === item.dataset.id);\n  const titleEl = item.querySelector(\".hist-title\");\n  if (!c || !titleEl) return;\n  const input = document.createElement(\"input\");\n  input.className = \"hist-rename\";\n  input.value = c.title;\n  input.ma ns fenced ```code``` blocks into copy-able boxes and escapes the rest.\n// This is the \"copy paste box\" feature: any code or long paragraph the\n// model returns gets its own box with a Copy button.\nfunction renderBotContent(raw) {\n  const codeFence = /```(\\w*)\\n?([\\s\\S]*?)```/g;\n  let lastIndex = 0;\n  let html = \"\";\n  let match;\n  let boxCount = 0;\n\n  while ((match = codeFence.exec(raw)) !== null) {\n    const before = raw.slice(lastIndex, match.index);\n    if (before.trim()) html += renderParagraphs(before);\n\n    const lang = match[1] || \"text\";\n    const code = match[2];\n    boxCount++;\n    const codeId = `code-${Date.now()}-${boxCount}`;\n    html += `\n      <div class=\"code-box\">\n        <div class=\"code-box-header\">\n          <span>${escapeHtml(lang)}<\/span>\n          <button onclick=\"copyBoxText('${codeId}', this)\">Copy<\/button>\n        <\/div>\n        <pre id=\"${codeId}\">${escapeHtml(code.trim())}<\/pre>\n      <\/div>`;\n    lastIndex = codeFence.lastIndex;\n  }\n  const rest = raw.slice(lastIndex);\n  if (rest.trim()) html += renderParagraphs(rest);\n  return (html || renderParagraphs(raw)).replace(/>\\s*\\n\\s*<\/g, '><').trim();\n}\n\n// Long plain-text paragraphs (>= 400 chars, no code fence) also get wrapped\n// in a copyable box, per the \"any copy paste stuff -> box\" request.\nfunction renderParagraphs(text) {\n  const trimmed = text.trim();\n  if (!trimmed) return \"\";\n  if (trimmed.length >= 400) {\n    const codeId = `para-${Date.now()}-${Math.floor(Math.random() * 9999)}`;\n    return `\n      <div class=\"code-box\">\n        <div class=\"code-box-header\">\n          <span>Response text<\/span>\n          <button onclick=\"copyBoxText('${codeId}', this)\">Copy<\/button>\n        <\/div>\n        <pre id=\"${codeId}\" style=\"white-space:pre-wrap;font-family:inherit;font-size:14.5px;\">${escapeHtml(trimmed)}<\/pre>\n      <\/div>`;\n  }\n  return `<span>${escapeHtml(trimmed).replace(/\\*\\*(.+?)\\*\\*/g \"Factual\", \"Fallback\"];\n\n// Same 5-router flow as landing.html. active = index that answered,\n// earlier ones are \"passed\" (first match wins), -1 = still scanning.\nfunction routerChips(active) {\n  const steps = ROUTERS.map((n, i) => {\n    const st = active < 0 ? \"\" : (i < active ? \"passed\" : (i === active ? \"active\" : \"idle\"));\n    return `<div class=\"router-step ${st}\" style=\"--i:${i}\"><b>${i + 1}<\/b> ${n}<\/div>` +\n           (i < ROUTERS.length - 1 ? '<span class=\"router-arrow\">\u2192<\/span>' : \"\");\n  }).join(\"\");\n  return `<div class=\"router-flow${active < 0 ? \" scanning\" : \"\"}\">${steps}<\/div>`;\n}\n\nfunction detectRouter(thought) {\n  const t = (thought || \"\").split(\"\\n\\n--- Model reasoning ---\")[0];\n  if (/SYSTEM ROUTER/i.test(t)) return 0;\n  if (/Identity query/i.test(t)) return 1;\n  if (/GENERATION|Generation Error|CAREFUL MODE RECOVERY/.test(t)) return 2;\n  if (/WEB VERIFIED/.test(t)) return 3;\n  return 4;\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n  const flow = document.getElementById(\"chat-flow\");\n  const empty = document.getElementById(\"empty-state\");\n  const sync = () => empty.classList.toggle(\"hide\", flow.childElementCount > 0);\n  new MutationObserver(sync).observe(flow, { childList: true });\n  sync();\n\n  empty.querySelectorAll(\".chip\").forEach(chip => {\n    chip.addEventListener(\"click\", () => {\n      const input = document.getElementById(\"userInput\");\n      input.value = chip.dataset.q;\n      toggleBtn();\n      send();\n    });\n  });\n});\n\n\n/* =========================================================================\n   STREAMING TEXT ANIMATION\n   Words resolve out of blur one by one, a caret trails the text, then the\n   action icons, source chip and follow-up prompts fade in and become usable.\n   ========================================================================= */\nconst REDUCED_MOTION = window.matchMedia(\"(prefers-reduced-motion: reduc tton>`).join(\"\")}\n    <\/div>`;\n  wrap.querySelector('[data-act=\"copy\"]').onclick = () =>\n    navigator.clipboard.writeText(bubble.innerText).catch(() => {});\n  wrap.querySelector('[data-act=\"retry\"]').onclick = () => {\n    const last = [...chatHistory].reverse().find(t => t.role === \"user\");\n    if (!last) return;\n    document.getElementById(\"userInput\").value = last.content;\n    send();\n  };\n  [\"up\", \"down\"].forEach(n => {\n    wrap.querySelector(`[data-act=\"${n}\"]`).onclick = e => {\n      const row = wrap.querySelector(\".stream-actions\");\n      row.querySelectorAll('[data-act=\"up\"],[data-act=\"down\"]').forEach(b => b.classList.remove(\"on\"));\n      e.currentTarget.classList.add(\"on\");\n    };\n  });\n  wrap.querySelectorAll(\".fu-btn\").forEach(b => b.onclick = () => {\n    document.getElementById(\"userInput\").value = b.textContent.replace(\"\u21b3 \", \"\");\n    send();\n  });\n  return wrap;\n}\n\nfunction streamBubble(bubbleId, thought) {\n  const bubble = document.getElementById(bubbleId);\n  if (!bubble) return;\n  const container = bubble.parentElement;\n  const original = bubble.innerHTML;\n  const extras = buildExtras(bubble, thought);\n  const meta = container.querySelector(\".meta-row\");\n  (meta || bubble).insertAdjacentElement(\"afterend\", extras);\n\n  const reveal = () => extras.classList.add(\"show\");\n  if (REDUCED_MOTION) { reveal(); return; }\n\n  // wrap every word of the text (code blocks fade in as one block instead)\n  const walker = document.createTreeWalker(bubble, NodeFilter.SHOW_TEXT);\n  const nodes = [];\n  while (walker.nextNode()) nodes.push(walker.currentNode);\n  const total = nodes.reduce((n, t) => n + (t.nodeValue.match(/\\S+/g) || []).length, 0) || 1;\n  const step = Math.min(70, 3200 / total);\n  let idx = 0;\n  nodes.forEach(node => {\n    const inCode = node.parentElement.closest('pre[id^=\"code-\"]');\n    if (inCode) return;\n    const frag = document.createDocumentFragment();\n  \"light\" ? \"#f3faf6\" : \"#04120e\");\n  document.querySelectorAll(\".theme-toggle\").forEach(b => b.setAttribute(\"aria-pressed\", t === \"light\"));\n  syncNetColors();\n}\n\nfunction switchTheme(originEl) {\n  const next = currentTheme() === \"dark\" ? \"light\" : \"dark\";\n  const reduced = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\n  // Fallback (no View Transitions API / reduced motion): soft cross-fade of colours.\n  if (!document.startViewTransition || reduced) {\n    if (!reduced) {\n      root.classList.add(\"theme-fade\");\n      setTimeout(() => root.classList.remove(\"theme-fade\"), 700);\n    }\n    applyTheme(next);\n    return;\n  }\n\n  const rect = originEl.getBoundingClientRect();\n  const x = rect.left + rect.width / 2;\n  const y = rect.top + rect.height / 2;\n  const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));\n\n  const vt = document.startViewTransition(() => applyTheme(next));\n  vt.ready.then(() => {\n    // new theme grows out of the button as a circle...\n    root.animate(\n      { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },\n      { duration: 750, easing: \"cubic-bezier(.22,1,.36,1)\", pseudoElement: \"::view-transition-new(root)\" }\n    );\n    // ...while the old theme softly recedes underneath it.\n    root.animate(\n      { filter: [\"blur(0px) brightness(1)\", \"blur(6px) brightness(.9)\"], transform: [\"scale(1)\", \"scale(1.025)\"] },\n      { duration: 750, easing: \"ease-out\", fill: \"forwards\", pseudoElement: \"::view-transition-old(root)\" }\n    );\n  });\n}\n\ndocument.querySelectorAll(\".theme-toggle\").forEach(btn => {\n  btn.addEventListener(\"click\", () => switchTheme(btn));\n});\napplyTheme(currentTheme());\n<\/script>\n<script>/* Regen 1o app \u2014 mobile & tablet extras. Load AFTER main.js (end of <body>). */\n(function () {\n  'use strict';\n  var de = document.documentElement, body = document.body, vv = window.visualViewport;\n  var sb = document.getElementById('sidebar'), ov = document.getElementById('sidebar-overlay'),\n      flow = document.getElementById('chat-flow'), main = document.getElementById('main-container'),\n      inp = document.getElementById('input-container');\n  var narrow = matchMedia('(max-width:900px)');\n\n  /* 1 \u2014 keyboard-aware layout: chat height follows the *visible* viewport, input never hides behind the keyboard */\n  function vsize() {\n    de.style.setProperty('--vvh', (vv ? vv.height : innerHeight) + 'px');\n    if (vv && vv.offsetTop) scrollTo(0, 0);\n    if (inp && main) {\n      var b = main.getBoundingClientRect().bottom - inp.getBoundingClientRect().top;\n      if (b > 0) de.style.setProperty('--input-h', Math.ceil(b) + 'px');\n    }\n  }\n  vsize();\n  if (vv) { vv.addEventListener('resize', function () { vsize(); if (flow && document.activeElement && document.activeElement.id === 'userInput') flow.scrollTop = flow.scrollHeight; }); vv.addEventListener('scroll', vsize); }\n  addEventListener('resize', vsize);\n  addEventListener('orientationchange', function () { setTimeout(vsize, 250); });\n  if (inp && window.ResizeObserver) new ResizeObserver(vsize).observe(inp);\n\n  /* 2 \u2014 swipe drawer: drag from the left edge to open, drag the drawer left to close; it follows your finger */\n  if (sb && ov) {\n    var W = 0, x0 = 0, y0 = 0, t0 = 0, dx = 0, drag = false, lock = 0, startOpen = false;\n    var setX = function (px) { sb.style.transform = 'translateX(' + px + 'px)'; ov.style.opacity = Math.max(0, 1 + px / W); };\n    document.addEventListener('touchstart', function (e) {\n      drag = false; lock = 0;\n      if (!narrow.matches || body.dataset.view !== 'view-chat' || e.touches.length > 1) return;\n      var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); dx = 0;\n      startOpen = sb.classList.contains('open'); W = sb.offsetWidth;\n      drag = startOpen ? (sb.contains(e.target) || e.target === ov) : x
