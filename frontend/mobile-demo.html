<!DOCTYPE html>
<html lang="en">
<head>

<title>Just Talk — phone & tablet preview</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;flex-direction:column;background:#04100c;color:#e8f5ef;font:14px/1.4 system-ui,-apple-system,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:14px 12px}
.grp{display:flex;gap:4px;padding:4px;border-radius:12px;background:#0b1a15;border:1px solid #1c3a2f}
button{font:600 13px system-ui;color:#8fb3a4;background:none;border:0;border-radius:9px;padding:9px 14px;cursor:pointer}
button.on{background:linear-gradient(100deg,#6ee7b7,#10a37f);color:#03130f}
.stage{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:6px 12px 28px}
.holder{position:relative}
.dev{position:absolute;top:0;left:0;transform-origin:0 0;background:#0c1613;border:2px solid #24413a;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(16,163,127,.12)}
.dev iframe{display:block;border:0;background:#fff}
.note{text-align:center;color:#6f8f83;font-size:12px;padding:0 16px 18px}
</style>
</head>
<body>
<div class="bar">
  <div class="grp" id="gDev"></div>
  <div class="grp" id="gPage"></div>
</div>
<div class="stage"><div class="holder" id="holder"><div class="dev" id="dev"><iframe id="fr" title="preview"></iframe></div></div></div>
<p class="note">Self-contained live preview of both pages (needs no other files). Scroll inside the frame like on a real device.</p>
<script>
var DEV={ 'Phone':[390,844,48,10], 'Small phone':[360,640,38,10], 'Tablet ▯':[820,1180,34,14], 'Tablet ▭':[1180,820,34,14] };
var PAGES={"index.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover\">\n<title>Just Talk \u2014 Agent-grade reasoning. Groq-grade speed.<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>:root{\n  --void:#f7f7f8; --panel:#ffffff; --panel-2:#f0f2f1; --line:#e3e6e5;\n  --text:#202123; --text-dim:#6e6e80;\n  --violet:#0b7a63; --pink:#10a37f; --orange:#19c37d;\n  --grad: linear-gradient(100deg, var(--orange), var(--pink) 55%, var(--violet));\n  --green:#22c55e;\n}\n*{box-sizing:border-box;margin:0;padding:0;}\nhtml{scroll-behavior:smooth;}\nbody{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--void);color:var(--text);overflow-x:hidden;}\nh1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}\na{color:inherit;text-decoration:none;}\nimg,canvas{display:block;}\n.wrap{max-width:1180px;margin:0 auto;padding:0 28px;}\n\n/* ---------- NAV ---------- */\nheader{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-bottom:1px solid rgba(16,24,20,.06);}\nnav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1180px;margin:0 auto;}\n.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;}\n.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;}\n.nav-links{display:flex;gap:28px;font-size:13.5px;color:var(--text-dim);}\n.nav-links a:hover{color:var(--text);}\n.nav-cta{background:var(--grad);color:#fff;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:700;}\n.nav-mobile-hide{display:flex;}\n@media (max-width:760px){.nav-mobile-hide{display:none;}}\n\n/* ---------- BACKDROP ---------- */\n.bg-glow{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}\n.bg-glow span{position:absolute;border-radius:50%;filter:blur(110px);opacity:.16;}\n.bg-glow .g1{width:50vw;height:50vw;background:var(--violet);top:-16%;right:-10%;}\n.bg-glow .g2{width:40vw;height:40vw;background:var(--pink);bottom:10%;left:-12%;}\n\n/* ---------- HERO ---------- */\n.hero{padding:70px 0 40px;}\n.hero-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;}\n@media (max-width:900px){.hero-grid{grid-template-columns:1fr;}}\n.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(16,24,20,.04);border:1px solid rgba(16,24,20,.10);padding:6px 14px;border-radius:30px;font-size:12.5px;color:var(--text-dim);margin-bottom:22px;}\n.eyebrow b{color:var(--text);}\n.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.08;font-weight:700;margin-bottom:20px;}\n.hero h1 .hl{background-image:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}\n.hero p.lead{color:var(--text-dim);font-size:16px;line-height:1.6;max-width:46ch;margin-bottom:28px;}\n.cta-row{display:flex;gap:14px;flex-wrap:wrap;}\n.btn{padding:13px 22px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px;transition:.15s;}\n.btn-solid{background:var(--grad);color:#fff;}\n.btn-solid:hover{filter:brightness(1.08);}\n.btn-ghost{background:rgba(16,24,20,.04);border:1px solid rgba(16,24,20,.12);color:var(--text);}\n.btn-ghost:hover{background:rgba(16,24,20,.07);}\n\n/* live terminal card */\n.term{background:rgba(255,255,255,.9);border:1px solid rgba(16,24,20,.10);border-radius:16px;overflow:hidden;backdrop-filter:blur(16px);box-shadow:0 30px 70px rgba(16,24,40,.14);}\n.term-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(16,24,20,.03);border-bottom:1px solid rgba(16,24,20,.06);}\n.dots{display:flex;gap:6px;}\n.dots span{width:9px;height:9px;border-radius:50%;}\n.dots span:nth-child(1){background:#ff5f57;} .dots span:nth-child(2){background:#febc2e;} .dots span:nth-child(3){background:#28c840;}\n.term-live{flex:1;font-family:'SFMono-Regular',Consolas,monospace;font-size:11.5px;color:var(--text-dim);display:flex;align-items:center;gap:6px;justify-content:flex-end;}\n.term-live::before{content:\"\u25cf\";color:var(--green);animation:blink 1.6s ease-in-out infinite;font-size:9px;}\n@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}\n.term-body{padding:16px 16px 10px;font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;line-height:1.65;min-height:230px;max-height:360px;overflow-y:auto;color:#202123;}\n.term-body .prompt{color:#0b7a63;}\n.term-body .muted{color:var(--text-dim);font-style:italic;}\n.term-body .ok{color:var(--green);}\n.term-foot{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid rgba(16,24,20,.06);}\n.term-foot input{flex:1;background:rgba(16,24,20,.04);border:1px solid rgba(16,24,20,.10);border-radius:9px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;font-family:inherit;}\n.term-foot button{background:var(--grad);color:#fff;border:none;width:36px;height:36px;border-radius:9px;font-weight:800;cursor:pointer;flex-shrink:0;}\n.term-meta{display:flex;justify-content:space-between;padding:6px 14px 12px;font-size:11px;color:#707078;}\n\n/* ---------- STATS ---------- */\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:50px 0;}\n@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}}\n.stat-card{background:rgba(16,24,20,.03);border:1px solid rgba(16,24,20,.06);border-radius:14px;padding:22px 20px;}\n.stat-card .num{font-family:'Space Grotesk';font-weight:700;font-size:26px;margin-bottom:4px;}\n.stat-card .lbl{font-size:12.5px;color:var(--text-dim);}\n.stat-card .sub{font-size:11px;color:#8e8ea0;margin-top:2px;}\n\n/* ---------- MARQUEE ---------- */\n.marquee-wrap{overflow:hidden;transform:rotate(-1deg);margin:10px 0 70px;}\n.marquee{display:flex;white-space:nowrap;background:var(--grad);padding:10px 0;}\n.mq-track{display:flex;gap:24px;animation:mq 20s linear infinite;padding-right:24px;}\n.mq-track span{font-family:'Space Grotesk';font-weight:700;font-size:12.5px;letter-spacing:.06em;color:#fff;text-transform:uppercase;display:flex;gap:24px;align-items:center;}\n@keyframes mq{from{transform:translateX(0);}to{transform:translateX(-50%);}}\n\n/* ---------- SECTION SHELL ---------- */\nsection.block{padding:70px 0;}\n.eyebrow-tag{font-family:'SFMono-Regular',Consolas,monospace;color:var(--pink);font-size:12.5px;letter-spacing:.05em;margin-bottom:14px;}\n.block h2{font-size:clamp(26px,4vw,38px);font-weight:700;margin-bottom:14px;}\n.block h2 i{font-style:italic;background-image:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}\n.block > p.desc{color:var(--text-dim);font-size:14.5px;max-width:60ch;margin-bottom:36px;}\n\n/* ---------- ROUTER FLOW ---------- */\n.router-flow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px;}\n.router-step{background:rgba(16,24,20,.04);border:1px solid rgba(16,24,20,.10);border-radius:10px;padding:10px 16px;font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:8px;}\n.router-step b{color:var(--text);}\n.router-arrow{color:var(--pink);font-weight:700;}\n.credit-demo{display:grid;grid-template-columns:1fr 1fr;gap:20px;}\n@media (max-width:760px){.credit-demo{grid-template-columns:1fr;}}\n.credit-card2{background:rgba(16,24,20,.03);border:1px solid rgba(16,24,20,.06);border-radius:16px;padding:22px;}\n.credit-card2 h4{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;}\n.bar-row{display:flex;align-items:center;gap:10px;margin:10px 0;font-family:'SFMono-Regular',Consolas,monospace;font-size:12px;}\n.bar-track{flex:1;height:8px;border-radius:6px;background:rgba(16,24,20,.06);overflow:hidden;}\n.bar-fill{height:100%;border-radius:6px;background:var(--grad);}\n.bar-fill.neg{background:linear-gradient(90deg,#ff4d4d,#ff2f6e);}\n\n/* ---------- NEURAL / ROUTER CANVAS ---------- */\n.net-card{position:relative;background:radial-gradient(circle at 30% 20%, rgba(16,163,127,.14), transparent 55%), rgba(16,24,20,.02);border:1px solid rgba(16,24,20,.06);border-radius:20px;padding:44px 34px;overflow:hidden;min-height:360px;}\n.net-card canvas{position:absolute;inset:0;width:100%;height:100%;}\n.net-card .net-copy{position:relative;z-index:2;max-width:440px;}\n.net-hint{font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:6px;margin-top:10px;}\n.net-stats{position:relative;z-index:2;display:flex;gap:14px;margin-top:210px;flex-wrap:wrap;}\n.net-pill{background:rgba(255,255,255,.9);border:1px solid rgba(16,24,20,.12);border-radius:12px;padding:12px 18px;text-align:center;}\n.net-pill b{display:block;font-family:'Space Grotesk';font-size:19px;}\n.net-pill span{font-size:10.5px;color:var(--text-dim);letter-spacing:.04em;}\n.net-counter{position:relative;z-index:2;background:rgba(255,255,255,.9);border:1px solid rgba(16,24,20,.12);border-radius:14px;padding:14px 18px;display:inline-flex;align-items:center;gap:10px;margin-top:18px;}\n.net-counter .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);animation:blink 1.4s ease-in-out infinite;}\n.net-counter b{font-family:'Space Grotesk';font-size:20px;}\n.net-counter span{font-size:11px;color:var(--text-dim);}\n\n/* ---------- FEATURES ---------- */\n.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}\n@media (max-width:900px){.feat-grid{grid-template-columns:repeat(2,1fr);}}\n@media (max-width:600px){.feat-grid{grid-template-columns:1fr;}}\n.feat-card{background:rgba(16,24,20,.03);border:1px solid rgba(16,24,20,.06);border-radius:16px;padding:22px;transition:transform .2s ease, border-color .2s ease;}\n.feat-card:hover{transform:translateY(-3px);border-color:rgba(16,24,20,.16);}\n.feat-icon{width:34px;height:34px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:14px;}\n.feat-card h3{font-size:15.5px;margin-bottom:8px;}\n.feat-card p{font-size:13px;color:var(--text-dim);line-height:1.55;}\n.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}\n.pill{background:rgba(16,24,20,.04);border:1px solid rgba(16,24,20,.10);border-radius:7px;padding:3px 9px;font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;color:#0b7a63;}\n\n/* ---------- SPECS / TICKET ---------- */\n.specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start;}\n@media (max-width:900px){.specs-grid{grid-template-columns:1fr;}}\n.ticket{background:rgba(16,24,20,.03);border:1.5px dashed rgba(16,24,20,.16);border-radius:20px;padding:26px;}\n.ticket-top{display:flex;justify-content:space-between;font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;color:var(--text-dim);margin-bottom:18px;}\n.ticket-num{font-size:60px;font-weight:800;font-family:'Space Grotesk';line-height:1;}\n.ticket-num span{background-image:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}\n.ticket-tag{font-size:12.5px;color:var(--text-dim);margin:6px 0 18px;}\n.ticket-rows{border-top:1px dashed rgba(16,24,20,.12);padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}\n.ticket-rows div span{display:block;font-size:10px;color:var(--text-dim);letter-spacing:.05em;font-family:'SFMono-Regular',Consolas,monospace;margin-bottom:3px;}\n.ticket-rows div b{font-size:13px;}\n.code-panel{background:rgba(255,255,255,.9);border:1px solid rgba(16,24,20,.10);border-radius:16px;overflow:hidden;}\n.code-tabs{display:flex;gap:2px;padding:10px 12px 0;}\n.code-tab{font-size:12px;font-family:'SFMono-Regular',Consolas,monospace;color:var(--text-dim);padding:6px 12px;border-radius:7px 7px 0 0;cursor:pointer;}\n.code-tab.active{background:rgba(16,24,20,.04);color:var(--text);}\n.code-panel pre{margin:0;padding:16px;font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;line-height:1.6;color:#202123;overflow-x:auto;}\n.code-panel .k{color:#0e7490;} .code-panel .s{color:#0b7a63;} .code-panel .c{color:#8e8ea0;}\n\n/* ---------- FAQ ---------- */\n.faq-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:40px;}\n@media (max-width:900px){.faq-grid{grid-template-columns:1fr;}}\n.faq-item{border:1px solid rgba(16,24,20,.06);border-radius:12px;margin-bottom:10px;overflow:hidden;background:rgba(16,24,20,.02);}\n.faq-q{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;cursor:pointer;font-size:14.5px;font-weight:600;}\n.faq-q .n{color:var(--pink);font-family:'SFMono-Regular',Consolas,monospace;font-size:12px;margin-right:10px;}\n.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;}\n.faq-a p{padding:0 18px 16px;color:var(--text-dim);font-size:13.5px;line-height:1.6;}\n.faq-item.open .faq-a{max-height:220px;}\n.faq-q .plus{transition:transform .2s ease;color:var(--text-dim);}\n.faq-item.open .plus{transform:rotate(45deg);}\n\n/* ---------- FINAL CTA ---------- */\n.cta-panel{background:var(--grad);border-radius:26px;padding:60px 48px;position:relative;overflow:hidden;background-image:var(--grad), radial-gradient(circle, rgba(255,255,255,.22) 1px, transparent 1px);background-size:auto, 16px 16px;}\n.cta-panel .eyebrow{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);color:#fff;}\n.cta-panel .eyebrow b{color:#fff;}\n.cta-panel h2{color:#fff;font-size:clamp(28px,4.4vw,44px);margin-bottom:14px;}\n.cta-panel p{color:rgba(255,255,255,.92);max-width:52ch;margin-bottom:26px;font-size:15px;}\n.cta-panel .btn-solid{background:#ffffff;color:#0b7a63;}\n.cta-panel .btn-ghost{background:transparent;border:none;color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:3px;}\n\nfooter{padding:36px 0 50px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;color:var(--text-dim);font-size:13px;border-top:1px solid rgba(16,24,20,.06);margin-top:20px;}\nfooter .flinks{display:flex;gap:22px;}\nfooter .flinks a:hover{color:var(--text);}\n\n/* ---------- SCROLL-REVEAL NAV + THEME ---------- */\nheader{\n  position:fixed;\n  top:0;left:0;right:0;\n  transform:translateY(-115%);\n  opacity:0;\n  pointer-events:none;\n  transition:transform .65s cubic-bezier(.16,1,.3,1),opacity .45s ease;\n  will-change:transform,opacity;\n}\nbody.nav-visible header{\n  transform:translateY(0);\n  opacity:1;\n  pointer-events:auto;\n}\nheader::after{\n  content:\"\";\n  position:absolute;inset:0;\n  background:linear-gradient(90deg,transparent,rgba(16,163,127,.08),transparent);\n  transform:translateX(-100%);\n  pointer-events:none;\n}\nbody.nav-visible header::after{animation:nav-scan 1.1s cubic-bezier(.16,1,.3,1);}\n@keyframes nav-scan{to{transform:translateX(100%)}}\n\n.theme-toggle{\n  position:relative;\n  width:43px;height:43px;\n  border:1px solid rgba(16,24,20,.12);\n  border-radius:12px;\n  background:rgba(16,24,20,.045);\n  color:var(--text);\n  cursor:pointer;\n  display:inline-grid;\n  place-items:center;\n  overflow:hidden;\n  transition:transform .25s ease,border-color .25s ease,background .25s ease;\n}\n.theme-toggle:hover{transform:translateY(-2px) rotate(4deg);border-color:rgba(16,163,127,.45)}\n.theme-toggle .theme-icon{position:absolute;font-size:17px;transition:transform .45s cubic-bezier(.16,1,.3,1),opacity .3s}\n.theme-toggle .sun{transform:translateY(25px) rotate(90deg);opacity:0}\n.theme-toggle .moon{transform:translateY(0) rotate(0);opacity:1}\nbody.light-mode .theme-toggle .sun{transform:translateY(0) rotate(0);opacity:1}\nbody.light-mode .theme-toggle .moon{transform:translateY(-25px) rotate(-90deg);opacity:0}\n\nbody.dark-mode{\n  --void:#050708; --panel:#0b1010; --panel-2:#0e1514; --line:#1b2926;\n  --text:#eefaf7; --text-dim:#91aaa4;\n  --violet:#20d9ae; --pink:#00cfa1; --orange:#75ffbf;\n  --green:#35f2a1;\n}\nbody.dark-mode .term,\nbody.dark-mode .code-panel{background:rgba(10,16,15,.84);border-color:rgba(117,255,191,.13)}\nbody.dark-mode .term-body,\nbody.dark-mode .code-panel pre{color:#e9faf5}\nbody.dark-mode .net-pill{background:rgba(10,16,15,.88);border-color:rgba(117,255,191,.14)}\nbody.dark-mode .btn-ghost{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.12)}\nbody.dark-mode .bg-glow span{opacity:.23}\nbody.dark-mode .stat-card,\nbody.dark-mode .feat-card,\nbody.dark-mode .credit-card2,\nbody.dark-mode .router-step,\nbody.dark-mode .faq-item,\nbody.dark-mode .ticket{background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.08)}\nbody.dark-mode .eyebrow{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.1)}\nbody.dark-mode .term-foot input{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.1)}\nbody.dark-mode .bar-track{background:rgba(255,255,255,.08)}\n@media(max-width:760px){header nav{padding:12px 16px}.theme-toggle{width:39px;height:39px}}\n\n.theme-pulse::before{\n  content:\"\";position:fixed;z-index:9999;pointer-events:none;\n  inset:50%;width:10px;height:10px;border-radius:50%;\n  background:var(--orange);\n  box-shadow:0 0 0 0 rgba(117,255,191,.45);\n  transform:translate(-50%,-50%);\n  animation:theme-burst .7s cubic-bezier(.16,1,.3,1) forwards;\n}\n@keyframes theme-burst{\n  0%{width:10px;height:10px;opacity:.75}\n  100%{width:180vmax;height:180vmax;opacity:0}\n}\n\n/* --- Deep dark theme cleanup --- */\nbody.dark-mode{\n  background:#050706 !important;\n  color:var(--text);\n}\nbody.dark-mode::selection{background:rgba(117,255,191,.25);color:#fff}\n\n/* Header becomes a real dark glass bar in dark mode */\nbody.dark-mode header{\n  background:rgba(4,8,7,.88) !important;\n  border-bottom:1px solid rgba(117,255,191,.13) !important;\n  box-shadow:0 10px 40px rgba(0,0,0,.28);\n}\nbody.dark-mode .nav-links,\nbody.dark-mode .brand{color:var(--text)}\nbody.dark-mode .nav-links a{color:#91aaa4}\nbody.dark-mode .nav-links a:hover{color:#eefaf7}\nbody.dark-mode .nav-cta{box-shadow:0 0 24px rgba(32,217,174,.10)}\nbody.dark-mode .theme-toggle{\n  background:rgba(255,255,255,.055);\n  border-color:rgba(117,255,191,.18);\n  color:#eefaf7;\n}\n\n/* Sections/cards that were still inheriting light surfaces */\nbody.dark-mode .net-card{\n  background:\n    radial-gradient(circle at 30% 20%,rgba(16,163,127,.11),transparent 55%),\n    rgba(5,9,8,.94) !important;\n  border-color:rgba(117,255,191,.12) !important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 20px 60px rgba(0,0,0,.20);\n}\nbody.dark-mode .net-counter{\n  background:rgba(7,13,12,.92) !important;\n  border-color:rgba(117,255,191,.15) !important;\n  color:#eefaf7;\n}\nbody.dark-mode .net-counter span{color:#91aaa4}\nbody.dark-mode .net-pill{\n  background:rgba(7,13,12,.92) !important;\n  color:#eefaf7;\n}\nbody.dark-mode .net-pill span{color:#91aaa4}\n\n/* Terminal/code surfaces */\nbody.dark-mode .term,\nbody.dark-mode .code-panel,\nbody.dark-mode .stat-card,\nbody.dark-mode .feat-card,\nbody.dark-mode .credit-card2,\nbody.dark-mode .router-step,\nbody.dark-mode .faq-item,\nbody.dark-mode .ticket{\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 18px 50px rgba(0,0,0,.16);\n}\n\n/* Main REGEN portal: ONLY this area becomes true black space */\nbody.dark-mode #regen-portal{\n  --gp-paper:#000 !important;\n  --gp-field:#000 !important;\n  background:#000 !important;\n  color:#fff !important;\n}\nbody.dark-mode #regen-portal [data-gp-field]{\n  opacity:1 !important;\n  background-color:#000 !important;\n  background-image:\n    radial-gradient(circle at 12% 18%,rgba(255,255,255,.90) 0 1px,transparent 1.5px),\n    radial-gradient(circle at 76% 28%,rgba(255,255,255,.75) 0 1px,transparent 1.5px),\n    radial-gradient(circle at 34% 72%,rgba(255,255,255,.65) 0 1px,transparent 1.5px),\n    radial-gradient(circle at 88% 82%,rgba(255,255,255,.70) 0 1px,transparent 1.5px),\n    radial-gradient(circle at 55% 45%,rgba(255,255,255,.55) 0 .8px,transparent 1.3px),\n    radial-gradient(circle at 20% 88%,rgba(255,255,255,.55) 0 .8px,transparent 1.3px),\n    radial-gradient(circle at 64% 8%,rgba(255,255,255,.55) 0 .8px,transparent 1.3px),\n    radial-gradient(circle at 96% 52%,rgba(255,255,255,.55) 0 .8px,transparent 1.3px) !important;\n  background-size:100% 100%,100% 100%,100% 100%,100% 100%,100% 100%,100% 100%,100% 100%,100% 100% !important;\n}\nbody.dark-mode #regen-portal [data-gp-default-field]{\n  opacity:0 !important;\n}\nbody.dark-mode #regen-portal [data-gp-viewport],\nbody.dark-mode #regen-portal [data-gp-pin],\nbody.dark-mode #regen-portal [data-gp-content]{\n  background-color:transparent !important;\n}\nbody.dark-mode #regen-portal [data-gp-content]{\n  color:#fff !important;\n}\nbody.dark-mode #regen-portal [data-gp-caption],\nbody.dark-mode #regen-portal [data-gp-caption] *{\n  color:#d7eee8 !important;\n}\n\n.tglyph{display:inline-block;height:.72em;width:.6em;vertical-align:baseline;margin:0 .02em 0 .01em;overflow:visible}\nbody.dark-mode .tglyph{filter:drop-shadow(0 0 .2em rgba(32,217,174,.6))}\n.sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}\nbody.dark-mode .sky{display:block}\nheader nav{position:relative;z-index:1}\n.cta-panel>*:not(.sky){position:relative;z-index:1}\nbody.dark-mode header{background:linear-gradient(90deg,rgba(2,12,9,.95),rgba(5,30,23,.95) 50%,rgba(2,12,9,.95)) !important;border-bottom:1px solid rgba(117,255,191,.2) !important}\nbody.dark-mode .brand-mark{background:linear-gradient(145deg,#06352b,#0a5a47);color:#75ffbf;border:1px solid rgba(117,255,191,.4);position:relative;overflow:hidden;box-shadow:0 0 14px rgba(32,217,174,.25)}\nbody.dark-mode .brand-mark::after{content:\"\";position:absolute;width:18px;height:1.5px;top:3px;left:100%;background:linear-gradient(90deg,#fff,transparent);transform-origin:left center;opacity:0;animation:logoStar 5s ease-in infinite}\n@keyframes logoStar{0%,70%{opacity:0;transform:translate(0,0) rotate(-35deg)}74%{opacity:1}92%{opacity:1;transform:translate(-44px,30px) rotate(-35deg)}100%{opacity:0;transform:translate(-44px,30px) rotate(-35deg)}}\nbody.dark-mode .btn-solid,body.dark-mode .nav-cta,body.dark-mode .term-foot button,body.dark-mode .marquee .mq-track span{color:#03130f}\nbody.dark-mode .term-body .prompt,body.dark-mode .pill{color:#75ffbf}\nbody.dark-mode .pill{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1)}\nbody.dark-mode .code-panel .k{color:#7dd3fc}body.dark-mode .code-panel .s{color:#75ffbf}body.dark-mode .code-panel .c{color:#6f8a84}\nbody.dark-mode .code-tab.active{background:rgba(255,255,255,.07)}\nbody.dark-mode .term-top{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.07)}\nbody.dark-mode .term-meta,body.dark-mode .stat-card .sub{color:#7f9a94}\nbody.dark-mode .cta-panel{background-color:#052b23;background-image:radial-gradient(circle,rgba(117,255,191,.10) 1px,transparent 1px),radial-gradient(circle at 15% 0%,rgba(32,217,174,.28),transparent 45%),radial-gradient(circle at 90% 100%,rgba(117,255,191,.16),transparent 40%),linear-gradient(135deg,#041f19,#0a4637 55%,#04231c);background-size:16px 16px,auto,auto,auto;border:1px solid rgba(117,255,191,.16)}\nbody.dark-mode #regen-portal{--gp-paper:#020504 !important;--gp-field:#06241d !important;background:#020504 !important}\nbody.dark-mode #regen-portal [data-gp-field]{background-color:#06241d !important;background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,0.9) 0 1px,transparent 1.5px),radial-gradient(circle at 76% 28%,rgba(255,255,255,0.75) 0 1px,transparent 1.5px),radial-gradient(circle at 34% 72%,rgba(255,255,255,0.65) 0 1px,transparent 1.5px),radial-gradient(circle at 88% 82%,rgba(255,255,255,0.7) 0 1px,transparent 1.5px),radial-gradient(circle at 55% 45%,rgba(255,255,255,0.55) 0 1px,transparent 1.5px),radial-gradient(circle at 20% 88%,rgba(255,255,255,0.55) 0 1px,transparent 1.5px),radial-gradient(circle at 64% 8%,rgba(255,255,255,0.55) 0 1px,transparent 1.5px),radial-gradient(circle at 96% 52%,rgba(255,255,255,0.55) 0 1px,transparent 1.5px),radial-gradient(circle at 18% 10%,rgba(32,217,174,.45),transparent 40%),radial-gradient(circle at 85% 80%,rgba(16,163,127,.35),transparent 45%),linear-gradient(135deg,#052a22,#0b4a3b 50%,#041d17) !important}\nbody.dark-mode #regen-portal [data-gp-front] p{color:#a9c9c1 !important}\nbody.dark-mode #regen-portal [data-gp-front] span{color:#7f9a94 !important}\nbody.dark-mode #regen-portal [data-gp-caption] a[data-gp-enter],body.dark-mode #regen-portal [data-gp-caption] a[data-gp-enter] span{color:#03130f !important}\n<\/style>\n<style>/* Just Talk landing \u2014 mobile & tablet layer. Load AFTER index.css.\n   Everything is inside max-width / hover:none queries, so desktop (>1024px) is untouched\n   and the portal / shooting-star / net animations keep running exactly as before. */\n.jt-progress,.jt-dock{display:none}\nsection.block{scroll-margin-top:72px}\n\n@media (max-width:1024px){\n  :root{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}\n  .wrap{padding:0 clamp(16px,4vw,28px)}\n  header nav{padding:12px clamp(14px,3vw,24px);padding-top:calc(12px + var(--safe-t))}\n  .hero{padding:44px 0 24px}\n  .hero-grid{gap:34px}\n  .hero p.lead{max-width:56ch}\n  .term-body{min-height:190px;max-height:300px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}\n  .term-foot input{font-size:16px;min-height:44px}\n  .term-foot button{width:44px;height:44px}\n  section.block{padding:52px 0}\n  .marquee-wrap{margin:6px 0 44px}\n  .net-card{padding:32px 24px;min-height:340px}\n  .net-card canvas{touch-action:pan-y}\n  .net-stats{margin-top:150px}\n  .faq-item.open .faq-a{max-height:600px}   /* 220px clipped long answers on narrow screens */\n  .jt-progress{display:block;position:fixed;top:0;left:0;width:100%;height:3px;z-index:60;pointer-events:none;\n    background:var(--grad);transform-origin:0 50%;transform:scaleX(0)}\n}\n\n@media (max-width:760px){\n  .hero{padding-top:30px}\n  .hero h1{font-size:clamp(32px,9.5vw,44px)}\n  .eyebrow{font-size:11.5px;margin-bottom:16px}\n  .cta-row .btn{flex:1 1 100%;justify-content:center;min-height:48px}\n  .brand{font-size:15px}\n  .nav-cta{padding:9px 14px}\n  .stats{gap:12px;margin:34px 0}\n  .stat-card{padding:16px 14px}\n  .stat-card .num{font-size:22px}\n  .router-step{padding:8px 12px;font-size:11.5px}\n  .credit-card2{padding:18px}\n  .net-card{padding:26px 18px;border-radius:16px;min-height:320px}\n  .net-stats{margin-top:120px;gap:10px}\n  .net-pill{flex:1;min-width:0;padding:9px 14px}\n  .ticket{padding:20px}\n  .ticket-num{font-size:48px}\n  .specs-grid{gap:24px}\n  .code-panel pre{font-size:11.5px;-webkit-overflow-scrolling:touch}\n  .cta-panel{padding:38px 22px;border-radius:20px}\n  footer{flex-direction:column;text-align:center;justify-content:center;padding-bottom:calc(110px + var(--safe-b))}\n  footer .flinks{flex-wrap:wrap;justify-content:center;gap:14px 20px}\n\n  /* floating glass dock \u2014 replaces the nav links that are hidden on phones */\n  .jt-dock{display:flex;position:fixed;left:50%;bottom:calc(14px + var(--safe-b));z-index:55;gap:2px;padding:6px;\n    border-radius:22px;background:rgba(255,255,255,.84);border:1px solid rgba(16,24,20,.1);\n    -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);\n    box-shadow:0 14px 40px rgba(16,40,30,.22);\n    transform:translate(-50%,140%);opacity:0;pointer-events:none;\n    transition:transform .55s cubic-bezier(.16,1,.3,1),opacity .4s ease}\n  body.nav-visible .jt-dock{transform:translate(-50%,0);opacity:1;pointer-events:auto}\n  .jt-dock a{display:grid;place-items:center;align-content:center;gap:3px;min-width:54px;height:50px;border-radius:16px;\n    font:600 10.5px/1 Inter,sans-serif;color:var(--text-dim);transition:color .2s,background .25s,transform .15s}\n  .jt-dock a:active{transform:scale(.92)}\n  .jt-dock svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}\n  .jt-dock a.on{color:#fff;background:var(--grad)}\n  .jt-dock a.go{color:var(--pink)}\n  body.dark-mode .jt-dock{background:rgba(4,14,11,.86);border-color:rgba(117,255,191,.2);box-shadow:0 14px 40px rgba(0,0,0,.5)}\n  body.dark-mode .jt-dock a.on{color:#03130f}\n}\n@media (max-width:420px){\n  .ticket-rows{grid-template-columns:1fr}\n  .stat-card .sub{display:none}\n}\n\n/* touch devices: no sticky hover states, tactile press feedback instead */\n@media (hover:none){\n  .feat-card:hover,.theme-toggle:hover{transform:none}\n  .btn:active,.nav-cta:active,.feat-card:active{transform:scale(.97)}\n  .faq-q{min-height:48px;-webkit-tap-highlight-color:transparent}\n}\n\n/* portal \"step inside\" copy: keep it inside one screen on small / landscape phones */\n@media (max-width:600px){\n  #regen-portal .rp-copy{gap:1.1rem}\n  #regen-portal .rp-feats{gap:1rem}\n  #regen-portal .rp-feat p{font-size:.88rem}\n}\n@media (max-height:560px) and (orientation:landscape){\n  #regen-portal .rp-copy h2{font-size:1.3rem}\n  #regen-portal .rp-feats{grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}\n  #regen-portal .rp-feat p{font-size:.8rem}\n}\n<\/style>\n<style>/* Custom line-icon set (replaces emoji / unicode glyph icons). Load after the main stylesheet. */\n.ic{width:1em;height:1em;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}\n.feat-icon .ic{width:18px;height:18px}\n.feat-card .feat-icon{color:#fff}\nbody.dark-mode .feat-card .feat-icon{color:#03130f}\n.eyebrow .ic{width:14px;height:14px;color:var(--pink)}\n.side-link .ic{width:16px;height:16px}\n.new-chat-btn .ic{width:16px;height:16px;margin-right:8px;vertical-align:-3px}\n<\/style>\n\n\n\n\n<\/head>\n<body>\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\"><defs><linearGradient id=\"tg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" style=\"stop-color:var(--orange)\"/><stop offset=\"1\" style=\"stop-color:var(--violet)\"/><\/linearGradient><symbol id=\"tsym\" viewBox=\"0 0 20 24\"><g fill=\"url(#tg)\"><rect x=\"0\" y=\"0\" width=\"20\" height=\"5.2\" rx=\"1.8\"/><rect x=\"7.4\" y=\"0\" width=\"5.2\" height=\"24\" rx=\"1.8\"/><rect x=\"2.6\" y=\"11.2\" width=\"14.8\" height=\"3.4\" rx=\"1.4\"/><\/g><\/symbol><\/defs><\/svg>\n\n<div class=\"bg-glow\"><span class=\"g1\"><\/span><span class=\"g2\"><\/span><\/div>\n\n<header>\n  <nav>\n    <div class=\"brand\"><span class=\"brand-mark\">J<\/span> Just <svg class=\"tglyph\" aria-hidden=\"true\" viewBox=\"0 0 20 24\"><use href=\"#tsym\"/><\/svg>alk<\/div>\n    <div class=\"nav-links nav-mobile-hide\">\n      <a href=\"#router\">How it decides<\/a>\n      <a href=\"#features\">Features<\/a>\n      <a href=\"#specs\">Specs<\/a>\n      <a href=\"#faq\">FAQ<\/a>\n    <\/div>\n    <button class=\"theme-toggle\" id=\"themeToggle\" type=\"button\" aria-label=\"Switch to light mode\" title=\"Switch theme\">\n  <span class=\"theme-icon moon\">\u263e<\/span><span class=\"theme-icon sun\">\u2600<\/span>\n<\/button>\n<a class=\"nav-cta\" href=\"app.html\">Launch app \u2192<\/a>\n  <\/nav>\n<\/header>\n\n<!-- ================= REGEN PORTAL (scroll intro) ================= -->\n<div id=\"regen-portal\"><\/div>\n\n\n<div class=\"wrap\">\n\n  <!-- ================= HERO ================= -->\n  <section class=\"hero\">\n    <div class=\"hero-grid\">\n      <div>\n        <div class=\"eyebrow\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M13 3 5 13.5h6L10 21l8-10.5h-6z\"/><\/svg> <b>20B parameters<\/b> \u00b7 Groq-hosted inference<\/div>\n        <h1>Agent-grade reasoning.<br><span class=\"hl\">Groq-grade speed.<\/span><\/h1>\n        <p class=\"lead\">Just <svg class=\"tglyph\" aria-hidden=\"true\" viewBox=\"0 0 20 24\"><use href=\"#tsym\"/><\/svg>alk routes every message, verifies facts against the live web, and shows you exactly how it got there \u2014 powered by GPT\u2011OSS\u201120B on Groq.<\/p>\n        <div class=\"cta-row\">\n          <a class=\"btn btn-solid\" href=\"app.html\">Start chatting \u2192<\/a>\n          <a class=\"btn btn-ghost\" href=\"#router\">See how it thinks<\/a>\n        <\/div>\n      <\/div>\n\n      <div class=\"term\">\n        <div class=\"term-top\">\n          <div class=\"dots\"><span><\/span><span><\/span><span><\/span><\/div>\n          <div class=\"term-live\">just <svg class=\"tglyph\" aria-hidden=\"true\" viewBox=\"0 0 20 24\"><use href=\"#tsym\"/><\/svg>alk \u00b7 live<\/div>\n        <\/div>\n        <div class=\"term-body\" id=\"termBody\">\n          <div class=\"muted\">Ask it something real \u2014 this talks to the live Just Talk backend.<\/div>\n        <\/div>\n        <div class=\"term-foot\">\n          <input id=\"termInput\" type=\"text\" placeholder=\"e.g. What's today's date?\">\n          <button id=\"termSend\">\u2191<\/button>\n        <\/div>\n        <div class=\"term-meta\">\n          <span id=\"termStatus\">\u25cf backend connecting\u2026<\/span>\n          <span id=\"termCredits\"><\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"stats\">\n      <div class=\"stat-card\"><div class=\"num\">20B<\/div><div class=\"lbl\">Parameters<\/div><div class=\"sub\">GPT-OSS-20B, dense transformer<\/div><\/div>\n      <div class=\"stat-card\"><div class=\"num\">5<\/div><div class=\"lbl\">Routers<\/div><div class=\"sub\">Temporal, identity, generation, factual, fallback<\/div><\/div>\n      <div class=\"stat-card\"><div class=\"num\">Live<\/div><div class=\"lbl\">Web verification<\/div><div class=\"sub\">Optional, toggled per session<\/div><\/div>\n      <div class=\"stat-card\"><div class=\"num\">100%<\/div><div class=\"lbl\">Reasoning shown<\/div><div class=\"sub\">Every reply ships its trace<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"marquee-wrap\">\n    <div class=\"marquee\"><div class=\"mq-track\">\n      <span>ROUTE <b>\u2192<\/b> VERIFY <b>\u2192<\/b> REASON <b>\u2192<\/b> ANSWER <b>+<\/b> LIVE WEB SEARCH <b>+<\/b> VISIBLE REASONING <b>+<\/b> PERSISTENT CREDITS <b>+<\/b><\/span>\n      <span>ROUTE <b>\u2192<\/b> VERIFY <b>\u2192<\/b> REASON <b>\u2192<\/b> ANSWER <b>+<\/b> LIVE WEB SEARCH <b>+<\/b> VISIBLE REASONING <b>+<\/b> PERSISTENT CREDITS <b>+<\/b><\/span>\n    <\/div><\/div>\n  <\/div>\n\n  <!-- ================= ROUTER / CREDITS ================= -->\n  <section class=\"block\" id=\"router\">\n    <div class=\"eyebrow-tag\">// 01 \u2014 How it decides<\/div>\n    <h2>Five routers. <i>One flow.<\/i><\/h2>\n    <p class=\"desc\">Every message is checked against five routers in order \u2014 the first match wins. Nothing gets a generic answer without a reason.<\/p>\n\n    <div class=\"router-flow\">\n      <div class=\"router-step\"><b>1<\/b> Temporal <span class=\"router-arrow\">\u2192<\/span><\/div>\n      <div class=\"router-step\"><b>2<\/b> Identity <span class=\"router-arrow\">\u2192<\/span><\/div>\n      <div class=\"router-step\"><b>3<\/b> Generation <span class=\"router-arrow\">\u2192<\/span><\/div>\n      <div class=\"router-step\"><b>4<\/b> Factual <span class=\"router-arrow\">\u2192<\/span><\/div>\n      <div class=\"router-step\"><b>5<\/b> Fallback<\/div>\n    <\/div>\n\n    <div class=\"credit-demo\">\n      <div class=\"credit-card2\">\n        <h4>Verified answer <span style=\"color:var(--green)\">+50<\/span><\/h4>\n        <div class=\"bar-row\"><span style=\"width:70px\">Credits<\/span><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:82%\"><\/div><\/div><span>820<\/span><\/div>\n        <p style=\"color:var(--text-dim);font-size:12.5px;margin-top:8px;\">Web search confirms the claim, or the model completes cleanly. Credits go up.<\/p>\n      <\/div>\n      <div class=\"credit-card2\">\n        <h4>Verification failure <span style=\"color:#ff4d6d\">-100<\/span><\/h4>\n        <div class=\"bar-row\"><span style=\"width:70px\">Credits<\/span><div class=\"bar-track\"><div class=\"bar-fill neg\" style=\"width:38%\"><\/div><\/div><span>380<\/span><\/div>\n        <p style=\"color:var(--text-dim);font-size:12.5px;margin-top:8px;\">Below 700, \"careful mode\" kicks in \u2014 the model leans harder on evidence and flags uncertainty. Going offline or turning search off never costs credits.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= NEURAL / ROUTER MAP ================= -->\n  <section class=\"block\">\n    <div class=\"net-card\">\n      <canvas id=\"netCanvas\"><\/canvas>\n      <div class=\"net-copy\">\n        <div class=\"eyebrow-tag\">// Inside the session<\/div>\n        <h2>One agent.<br>Every message routed live.<\/h2>\n        <div class=\"net-hint\">\u25b7 Move your cursor through the network<\/div>\n      <\/div>\n      <div class=\"net-counter\">\n        <span class=\"dot\"><\/span>\n        <div><b id=\"msgCounter\">0<\/b><br><span>messages routed since you arrived<\/span><\/div>\n      <\/div>\n      <div class=\"net-stats\">\n        <div class=\"net-pill\"><b>20B<\/b><span>PARAMS<\/span><\/div>\n        <div class=\"net-pill\"><b>0.6<\/b><span>TEMP<\/span><\/div>\n        <div class=\"net-pill\"><b>4096<\/b><span>MAX TOKENS<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= FEATURES ================= -->\n  <section class=\"block\" id=\"features\">\n    <div class=\"eyebrow-tag\">// 02 \u2014 Features<\/div>\n    <h2>Small setup. <i>Real agent work.<\/i><\/h2>\n    <p class=\"desc\">Everything Just <svg class=\"tglyph\" aria-hidden=\"true\" viewBox=\"0 0 20 24\"><use href=\"#tsym\"/><\/svg>alk ships with, out of the box.<\/p>\n\n    <div class=\"feat-grid\">\n      <div class=\"feat-card\">\n        <div class=\"feat-icon\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M13 3 5 13.5h6L10 21l8-10.5h-6z\"/><\/svg><\/div>\n        <h3>Groq inference<\/h3>\n        <p>Runs on Groq's LPU hardware for fast, streaming-ready responses.<\/p>\n      <\/div>\n      <div class=\"feat-card\">\n        <div class=\"feat-icon\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"m16 16 4.5 4.5\"/><\/svg><\/div>\n        <h3>Live web search<\/h3>\n        <p>Optional DuckDuckGo lookups ground factual and generation queries in current sources.<\/p>\n        <div class=\"pill-row\"><span class=\"pill\">force_google_scrape()<\/span><span class=\"pill\">maybe_scrape()<\/span><\/div>\n      <\/div>\n      <div class=\"feat-card\">\n        <div class=\"feat-icon\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"2.2\"/><circle cx=\"18\" cy=\"18\" r=\"2.2\"/><path d=\"M8.2 6H14a4 4 0 0 1 4 4v5.8\"/><\/svg><\/div>\n        <h3>Five-stage routing<\/h3>\n        <p>Temporal, identity, generation, factual, and fallback routers \u2014 each with its own logic.<\/p>\n      <\/div>\n      <div class=\"feat-card\">\n        <div class=\"feat-icon\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 6h6M4 12h10M4 18h14\"/><path d=\"m17 4 1 2.2L20 7l-2 .8L17 10l-.9-2.2L14 7l2.1-.8z\"/><\/svg><\/div>\n        <h3>Visible reasoning<\/h3>\n        <p>Reasoning is requested in parsed form and shown in a collapsible trace, not thrown away.<\/p>\n      <\/div>\n      <div class=\"feat-card\">\n        <div class=\"feat-icon\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"6\" rx=\"7\" ry=\"3\"/><path d=\"M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6\"/><\/svg><\/div>\n        <h3>Persistent credits<\/h3>\n        <p>A reliability score saved to disk \u2014 survives restarts and reloads, not reset to 1000 every session.<\/p>\n      <\/div>\n      <div class=\"feat-card\">\n        <div class=\"feat-icon\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"7\" rx=\"2\"/><rect x=\"4\" y=\"13\" width=\"16\" height=\"7\" rx=\"2\"/><path d=\"M8 7.5h.01M8 16.5h.01\"/><\/svg><\/div>\n        <h3>Self-hostable<\/h3>\n        <p>Flask + CORS underneath. Point the frontend at your own server and run it anywhere.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= SPECS ================= -->\n  <section class=\"block\" id=\"specs\">\n    <div class=\"eyebrow-tag\">// 03 \u2014 Model card<\/div>\n    <h2>Small footprint. <i>Real specs.<\/i><\/h2>\n    <p class=\"desc\" style=\"margin-bottom:26px;\">What's actually running under Just <svg class=\"tglyph\" aria-hidden=\"true\" viewBox=\"0 0 20 24\"><use href=\"#tsym\"/><\/svg>alk.<\/p>\n\n    <div class=\"specs-grid\">\n      <div class=\"ticket\">\n        <div class=\"ticket-top\"><span>JUST <svg class=\"tglyph\" aria-hidden=\"true\" viewBox=\"0 0 20 24\"><use href=\"#tsym\"/><\/svg>ALK<\/span><span>NO. 0001<\/span><\/div>\n        <div class=\"ticket-num\">20<span>B<\/span><\/div>\n        <div class=\"ticket-tag\">parameters \u00b7 agentic \u00b7 Groq-hosted<\/div>\n        <div class=\"ticket-rows\">\n          <div><span>MODEL<\/span><b>openai/gpt-oss-20b<\/b><\/div>\n          <div><span>HOST<\/span><b>Groq<\/b><\/div>\n          <div><span>TEMPERATURE<\/span><b>0.6<\/b><\/div>\n          <div><span>MAX TOKENS<\/span><b>4096<\/b><\/div>\n          <div><span>REASONING<\/span><b>Parsed, visible<\/b><\/div>\n          <div><span>TOOL CALLING<\/span><b>Live web search<\/b><\/div>\n          <div><span>HISTORY WINDOW<\/span><b>Last 12 turns<\/b><\/div>\n          <div><span>DEPLOYMENT<\/span><b>Flask + CORS, self-hostable<\/b><\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"code-panel\">\n        <div class=\"code-tabs\"><div class=\"code-tab active\">fetch<\/div><div class=\"code-tab\">curl<\/div><\/div>\n        <pre><span class=\"c\">// call your own Just Talk backend<\/span>\n<span class=\"k\">const<\/span> res = <span class=\"k\">await<\/span> fetch(<span class=\"s\">\"https://your-backend.onrender.com/chat\"<\/span>, {\n  method: <span class=\"s\">\"POST\"<\/span>,\n  headers: { <span class=\"s\">\"Content-Type\"<\/span>: <span class=\"s\">\"application/json\"<\/span> },\n  body: JSON.stringify({\n    message: <span class=\"s\">\"Summarize today's tickets\"<\/span>,\n    history: [],\n    web_search_enabled: <span class=\"k\">true<\/span>\n  })\n});\n<span class=\"k\">const<\/span> data = <span class=\"k\">await<\/span> res.json();\nconsole.log(data.reply, data.thought, data.credits);<\/pre>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= FAQ ================= -->\n  <section class=\"block\" id=\"faq\">\n    <div class=\"faq-grid\">\n      <div>\n        <div class=\"eyebrow-tag\">// 04 \u2014 FAQ<\/div>\n        <h2>Questions,<br>answered.<\/h2>\n      <\/div>\n      <div>\n        <div class=\"faq-item\">\n          <div class=\"faq-q\"><span><span class=\"n\">01<\/span>How can a 20B model feel this fast?<\/span><span class=\"plus\">+<\/span><\/div>\n          <div class=\"faq-a\"><p>It runs on Groq's LPU inference hardware, which streams tokens far faster than typical GPU-hosted endpoints at this size.<\/p><\/div>\n        <\/div>\n        <div class=\"faq-item\">\n          <div class=\"faq-q\"><span><span class=\"n\">02<\/span>Does turning off web search cost credits?<\/span><span class=\"plus\">+<\/span><\/div>\n          <div class=\"faq-a\"><p>No. Disabling search, or the search backend being unreachable, never deducts credits \u2014 only a genuine verification failure does.<\/p><\/div>\n        <\/div>\n        <div class=\"faq-item\">\n          <div class=\"faq-q\"><span><span class=\"n\">03<\/span>Can I run this on my own hardware?<\/span><span class=\"plus\">+<\/span><\/di
